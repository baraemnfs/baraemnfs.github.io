<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>مدرسة البراعم — صفحة المعلم</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f5e3b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="البراعم">
<meta name="robots" content="noindex,nofollow">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Aref+Ruqaa:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#17301f; --muted:#5e7065; --line:#dce5de; --bg:#f5f7f4; --card:#ffffff;
  --brand:#1f5e3b; --brand2:#24704a; --soft:#e6f0ea; --accent:#b8862b; --gold:#b8862b;
  --ok:#1e7b34; --warn:#c0392b;
  --r1:#f3b2b2; --r2:#f6cfa8; --r3:#fbe7a1; --r4:#cde8b5; --r5:#9bd3a5;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;font-size:15px;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 14px 110px}
header.top{background:var(--brand);color:#fff;padding:12px 16px 14px;padding-top:max(12px,env(safe-area-inset-top))}
header.top .logo{width:42px;height:42px;flex-shrink:0;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;border:2px solid var(--gold)}
header.top .logo svg{width:30px;height:30px;display:block}
header.top .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px}
header.top h1{font-family:'Aref Ruqaa',serif;font-size:24px;line-height:1.15;margin:0;font-weight:700}
header.top small{display:block;opacity:.8;font-size:12.5px;font-weight:400}
header.top .who{margin-inline-start:auto;text-align:left;font-size:13px;opacity:.95;line-height:1.7}
header.top .who a{color:#fff;opacity:.85;cursor:pointer;text-decoration:underline;margin-inline-start:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px}
.card h2{font-size:15px;margin:0 0 12px;color:var(--brand);display:flex;align-items:center;gap:8px}
.card h2 .grow{flex:1}
label.f{display:block;font-size:13px;color:var(--muted);margin:10px 0 6px}
select,input[type=password],input[type=text],input[type=date],.grid2 input[type=number]{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
.btn{border:0;border-radius:10px;padding:12px 16px;background:var(--brand2);color:#fff;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:#fff;color:var(--brand2);border:1px solid var(--brand2)}
.btn.sm{padding:7px 12px;font-size:13px}
.btn.danger{background:#fff;color:var(--warn);border:1px solid var(--warn)}
.btn.block{width:100%;margin-top:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;cursor:pointer;font-size:14px}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chip.done{border-color:#9cc77d}
.chip .n{font-size:11.5px;opacity:.75;margin-inline-start:4px}
.chips.small .chip{padding:6px 11px;font-size:13px}
.tabs{display:flex;background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px;margin-top:14px;position:sticky;top:0;z-index:5}
.tab{flex:1;border:0;background:transparent;padding:10px 6px;border-radius:9px;cursor:pointer;font-weight:600;color:var(--muted);font-size:14px}
.tab.on{background:var(--soft);color:var(--brand)}
.sub{margin-top:12px}
.sub .lbl{font-size:12.5px;color:var(--muted);margin-bottom:6px}
.bar{display:flex;align-items:center;gap:10px;margin:14px 2px 6px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.bar .grow{flex:1}
.bar .fill{border:1px dashed var(--brand2);color:var(--brand2);background:#fff;border-radius:8px;padding:5px 10px;cursor:pointer;font-size:12.5px}
.list{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:8px;padding:10px 12px;border-top:1px solid var(--line);flex-wrap:wrap}
.list > .row:first-child{border-top:0}
.row .nm{flex:1;min-width:0}
.row .nm b{display:block;font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm i{display:block;font-style:normal;font-size:12px;color:var(--warn);margin-top:2px}
.row .nm i.none{color:var(--muted)}
.row .nm small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.row.done{background:#fbfefb}
.sc{display:flex;gap:5px;flex-shrink:0}
.sc button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:600;padding:0}
.sc button.on[data-v="1"]{background:var(--r1);border-color:#e08f8f}
.sc button.on[data-v="2"]{background:var(--r2);border-color:#e0ad80}
.sc button.on[data-v="3"]{background:var(--r3);border-color:#dfc66a}
.sc button.on[data-v="4"]{background:var(--r4);border-color:#9cc77d}
.sc button.on[data-v="5"]{background:var(--r5);border-color:#6fb67c}
.grade{width:84px;flex-shrink:0;padding:9px 8px;border:1px solid var(--line);border-radius:9px;text-align:center;font-weight:600;background:#fff}
.grade.bad{border-color:var(--warn);background:#fdecea}
.nb{flex-shrink:0;border:1px solid var(--line);background:#fff;border-radius:9px;height:34px;padding:0 9px;cursor:pointer;font-size:12.5px;color:var(--muted)}
.nb.has{border-color:var(--accent);color:var(--accent);background:#fffaf0;font-weight:600}
.sc.four button{min-width:0;width:auto;flex:1;height:auto;min-height:44px;padding:4px 2px;font-size:12px;line-height:1.2;display:flex;flex-direction:column;align-items:center;justify-content:center}
.sc.four button small{font-size:11px;opacity:.65;margin-top:2px}
.row.wrap4{flex-wrap:wrap}
.row.wrap4 .nm{flex-basis:calc(100% - 50px)}
.row.wrap4 .sc.four{order:3;flex-basis:100%;margin-top:6px}
.obstrip{display:none;position:fixed;bottom:calc(84px + env(safe-area-inset-bottom,0px));inset-inline:10px;z-index:60;background:#fff8e1;border:1px solid #f0d27a;color:#6b5200;border-radius:12px;padding:8px 12px;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.08);cursor:pointer;text-align:center}
.obstrip.ok{background:#eaf6ec;border-color:#9fd1a8;color:#1d5b2a}
.obstrip.bad{background:#fdecec;border-color:#eba4a4;color:#8a1f1f}
textarea.need{border-color:#d9534f;box-shadow:0 0 0 3px rgba(217,83,79,.15)}
.noteRow{flex-basis:100%;display:flex}
.noteRow textarea,.row textarea.t{flex:1;min-height:40px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;resize:vertical;background:#fff}
.row textarea.t{flex:1.4}
.legend{font-size:12px;color:var(--muted);margin:8px 2px 0}
.empty{padding:26px;text-align:center;color:var(--muted)}
.banner{background:#fffaf0;border:1px solid #ecd9a8;color:#6b5414;border-radius:12px;padding:10px 12px;margin-top:12px;font-size:13px;line-height:1.7}
.badge{display:inline-block;background:var(--soft);color:var(--brand);border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600}
.trow{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.trow:first-child{border-top:0}
.trow .lab{flex:1;min-width:170px;font-size:14px}
.trow .lab .nb{height:26px;padding:0 7px;margin-inline-start:6px;vertical-align:middle;font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
footer.save{position:fixed;bottom:0;inset-inline:0;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));backdrop-filter:blur(6px);z-index:10}
footer.save .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px}
footer.save .st{flex:1;font-size:13px;color:var(--muted)}
footer.save .st.dirty{color:var(--accent);font-weight:600}
footer.save .st.ok{color:var(--ok);font-weight:600}
footer.save .st.err{color:var(--warn);font-weight:600}
.loading{position:fixed;inset:0;background:rgba(245,247,244,.7);display:none;align-items:center;justify-content:center;z-index:20;font-weight:600;color:var(--brand)}
.loading.on{display:flex}
.hint{font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.7}
.install{border-color:#e6d5ad;background:#fffbf2}
.att .big{display:flex;gap:10px;margin-top:12px}
.att .big .btn{flex:1;padding:14px 10px;font-size:16px}
.att .times{display:flex;gap:10px;margin-top:10px}
.att .times div{flex:1;background:var(--soft);border-radius:10px;padding:8px 10px;text-align:center}
.att .times b{display:block;font-size:20px;color:var(--brand)}
.att .times small{color:var(--muted);font-size:12px}
.att textarea,.why{width:100%;min-height:44px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;margin-top:6px;background:#fff}
.warn{color:var(--warn);font-weight:600}
.okc{color:var(--ok);font-weight:600}
.roles{display:flex;flex-wrap:wrap;gap:8px}
.tri{min-width:62px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 8px;cursor:pointer;font-size:12.5px;line-height:1.4}
.tri small{display:block;color:var(--muted);font-size:11px}
.tri.yes{background:var(--r5);border-color:#6fb67c}
.tri.no{background:var(--r1);border-color:#e08f8f}
.opts{display:flex;gap:4px;flex-wrap:wrap}
.opts button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 8px;font-size:12.5px;cursor:pointer}
.opts button.on.s0{background:var(--r5);border-color:#6fb67c}
.opts button.on.s1{background:var(--r3);border-color:#dfc66a}
.opts button.on.s2{background:var(--r1);border-color:#e08f8f}
.opts button.on.s3{background:#e5e9ea;border-color:#b9c3c5}
.tin{width:96px;padding:7px 6px;border:1px solid var(--line);border-radius:8px;background:#fff;text-align:center}
.dimrow{opacity:.6}
.install h2{color:var(--gold)}
.mrow{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.mrow select{width:auto;flex:1;max-width:220px;padding:8px 10px}
.mrow span{font-size:13px;color:var(--muted)}
@media (max-width:480px){
  .sc button{width:30px;height:32px}
  .sc{gap:4px}
  .row{padding:9px 10px}
  .grade{width:70px}
  .grid2{grid-template-columns:1fr}
  .nb{padding:0 7px}
}
</style>
</head>
<body>
<header class="top"><div class="in">
  <div class="logo" aria-hidden="true"><svg viewBox="0 0 120 120"><path d="M60 114 C60 92 60 72 60 54" fill="none" stroke="#1F5E3B" stroke-width="7" stroke-linecap="round"/><path d="M60 86 C43 86 28 75 24 58 C42 58 56 69 60 86 Z" fill="#1F5E3B"/><path d="M60 74 C77 74 93 61 97 44 C78 44 64 57 60 74 Z" fill="#1F5E3B"/><path d="M60 54 C49 45 49 25 60 12 C71 25 71 45 60 54 Z" fill="#B8862B"/></svg></div>
  <div><h1 id="ttl">مدرسة البراعم</h1><small>صفحة المعلم — المتابعة الشهرية وزيارات الحصص</small></div>
  <div class="who" id="who"></div>
</div></header>
<div class="wrap" id="app"></div>
<footer class="save" id="savebar" style="display:none"><div class="in">
  <div class="st" id="st">لا توجد تغييرات</div>
  <button class="btn" id="saveBtn" disabled>حفظ</button>
</div></footer>
<div class="loading" id="loading">جارٍ التحميل…</div>
<script>
var S = {boot:null, teacher:'', pin:'', month:'', sup:false, view:'login', home:null,
         cls:'', data:null, tab:'grades', subject:'', si:0, quick:0, group:0, item:0,
         acad:{}, edu:{}, det:{}, orig:{acad:{}, edu:{}, det:{}}, open:{}, dirty:false,
         vinit:null, v:null, vItem:0, homes:{}, classes:{}, att:null, tk:null, tg:null, asSup:false, finit:null, f:null};
var app = document.getElementById('app');
var NOTES = [{key:'أبرز ما تحسّن', label:'أبرز ما تحسّن'}, {key:'ما يحتاج متابعة', label:'ما يحتاج متابعة'}];
var LEAVE = 'لديك تغييرات غير محفوظة. هل تريد المتابعة دون حفظ؟';

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
var busy=0;
function load(on){ busy=Math.max(0,busy+(on?1:-1)); document.getElementById('loading').classList.toggle('on',busy>0); }
var API_URL='https://script.google.com/macros/s/AKfycbwVRJuchV8FGt_BRcCIJjmh4TwzE74CHZ-OYwH9Bml-yEMfEaJbPqxMDDNOygqTuF3BeA/exec';
var IS_APP='yes'==='yes';  // true only in the installable app on GitHub Pages
function call(fn,args,ok,onFail,quiet){
  var shown=!quiet; if(shown) load(true);
  function done(){ if(shown){ shown=false; load(false); } }
  function fail(m){ done(); if(onFail){ onFail(m); return; } status('err', m || 'حدث خطأ، حاول مرة أخرى'); }
  function viaScriptRun(){
    if(!(window.google && google.script && google.script.run)){ fail('تعذّر الاتصال بالخادم. تأكد من الإنترنت ثم أعد المحاولة.'); return; }
    var r = google.script.run.withSuccessHandler(function(x){done();ok(x);})
      .withFailureHandler(function(e){ fail(e && e.message); });
    r[fn].apply(r,args);
  }
  if(API_URL.indexOf('https://')!==0 || !window.fetch){ viaScriptRun(); return; }
  var ctl=window.AbortController? new AbortController() : null, timer=setTimeout(function(){ if(ctl) ctl.abort(); }, 60000);
  fetch(API_URL,{method:'POST',credentials:'omit',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args}),signal:ctl?ctl.signal:undefined})
    .then(function(r){ if(!r.ok) throw new Error('http'); return r.json(); })
    .then(function(res){
      clearTimeout(timer);
      if(res && res.ok){ done(); setTimeout(function(){ ok(res.v); },0); } else fail(res && res.err);
    }, function(e){
      clearTimeout(timer);
      if(e && e.name==='AbortError'){ fail('انتهت مهلة الاتصال. تحقّق من الإنترنت ثم أعد المحاولة؛ إن كنت حفظت، افتح الصفحة من جديد لترى هل وصل الحفظ.'); return; }
      if(!IS_APP && window.google && google.script && google.script.run) viaScriptRun(); else fail('تعذّر الاتصال بالخادم. تأكد من الإنترنت ثم أعد المحاولة.');
    });
}
function store(k,v){try{ if(v===undefined) return localStorage.getItem(k); if(v===null) localStorage.removeItem(k); else localStorage.setItem(k,v);}catch(e){return null;}}
function forget(){ store('albaraem_pin',null); store('albaraem_home',null); S.pin=''; S.homes={}; S.classes={}; S.home=null; S.att=null; S.attAt=0; S.attBusy=false; S.vinit=null; S.v=null; S.tk=null; S.tg=null; S.dirty=false; }
function jget(k){ try{ return JSON.parse(store(k)||'null'); }catch(e){ return null; } }
function jput(k,v){ try{ store(k,JSON.stringify(v)); }catch(e){} }
function thisMonth(months,fallback){ var d=new Date(), m=(d.getMonth()+1)+'/'+d.getFullYear(); return months.indexOf(m)>=0 ? m : (fallback && months.indexOf(fallback)>=0 ? fallback : months[0]); }
function hkey(){ return S.teacher+'|'+S.month; }
function status(kind,msg){var st=document.getElementById('st'); st.className='st '+(kind||''); st.textContent=msg; if(kind==='err') document.getElementById('savebar').style.display='block';}
function setDirty(d){S.dirty=d; document.getElementById('saveBtn').disabled=!d; status(d?'dirty':'', d?'تغييرات غير محفوظة':'لا توجد تغييرات');}
function leave(fn){ if(S.dirty && !confirm(LEAVE)) return; setDirty(false); fn(); }
function clone(o){return JSON.parse(JSON.stringify(o||{}));}
function keep(fn){var y=window.scrollY; fn(); window.scrollTo(0,y);}
window.addEventListener('beforeunload',function(e){ if(S.dirty){e.preventDefault(); e.returnValue='';} });

// ---------------------------------------------------------------- login
function start(){
  function cantLoad(){ load(false); app.innerHTML='<div class="card"><h2>تعذّر تحميل الصفحة</h2><div class="hint" style="margin-top:0">تأكد من اتصال الإنترنت ثم أعد المحاولة.'+(IS_APP?'':' إذا كنت مسجّلًا بأكثر من حساب Google في هذا المتصفح، افتح الرابط في نافذة خاصة (Incognito) أو من الجوال.')+'</div><button class="btn block" onclick="location.reload()">إعادة المحاولة</button></div>'; }
  setTimeout(function(){ if(!S.boot && !S.home) cantLoad(); }, 15000);
  var cached=jget('albaraem_boot'), savedPin=store('albaraem_pin');
  S.teacher=store('albaraem_teacher')||'';
  function known(b){ return b && b.teachers.some(function(x){return x.name===S.teacher;}); }
  function gotBoot(b){ S.boot=b; jput('albaraem_boot',b); }
  if(S.teacher && savedPin!==null && known(cached)){
    // remembered login: show the last home page at once, then refresh boot + home together (one round trip)
    S.boot=cached; S.pin=savedPin; S.month=thisMonth(cached.months,cached.currentMonth);
    var last=jget('albaraem_home');
    if(last && last.key===hkey()){ S.homes[hkey()]=last.h; S.home=last.h; S.sup=!!last.h.supervisor; renderHome(); }
    call('webBootstrap',[],gotBoot,function(){},true);
    homeFetch(!S.home, function(m){
      if(/غير صحيح|غير موجود|لا يوجد رمز/.test(m||'')){ forget(); renderLogin(); return; }
      if(S.home) return;   // keep showing the cached page
      app.innerHTML='<div class="card"><h2>تعذّر الاتصال</h2><div class="hint" style="margin-top:0">'+esc(m||'تأكد من اتصال الإنترنت ثم أعد المحاولة.')+'</div><button class="btn block" onclick="location.reload()">إعادة المحاولة</button></div>';
    });
    return;
  }
  if(cached){ S.boot=cached; S.month=thisMonth(cached.months,cached.currentMonth); renderLogin(); call('webBootstrap',[],function(b){ gotBoot(b); if(S.view==='login' && JSON.stringify(b.teachers)!==JSON.stringify(cached.teachers)) renderLogin(); },function(){},true); return; }
  call('webBootstrap',[],function(b){ gotBoot(b); S.month=thisMonth(b.months,b.currentMonth); renderLogin(); }, cantLoad);
}
function renderLogin(){
  S.view='login';
  document.getElementById('savebar').style.display='none';
  document.getElementById('who').innerHTML='';
  var b=S.boot, t=b.teachers, opts='<option value="">— اختر اسمك —</option>';
  t.forEach(function(x){opts+='<option value="'+esc(x.name)+'"'+(x.name===S.teacher?' selected':'')+'>'+esc(x.name)+'</option>';});
  var mo=''; b.months.forEach(function(m){mo+='<option value="'+esc(m)+'"'+(m===S.month?' selected':'')+'>'+esc(m)+'</option>';});
  app.innerHTML='<div class="card"><h2>الدخول</h2>'+
    '<label class="f">الاسم</label><select id="tSel">'+opts+'</select>'+
    '<div id="pinBox"></div>'+
    '<label class="f">الشهر</label><select id="mSel">'+mo+'</select>'+
    '<button class="btn block" id="go">دخول</button>'+
    '<div class="hint">رمز الدخول أربعة أرقام تأخذه من الإدارة. يتذكّر هذا الجهاز دخولك، فلا تحتاج لكتابته مرة أخرى حتى تضغط «خروج».</div></div>';
  var tSel=document.getElementById('tSel');
  function pinUi(){
    var x=t.filter(function(y){return y.name===tSel.value;})[0];
    document.getElementById('pinBox').innerHTML = x ? '<label class="f">رمز الدخول</label><input type="password" id="pin" inputmode="numeric" maxlength="8" autocomplete="off">' : '';
  }
  tSel.onchange=pinUi; pinUi();
  document.getElementById('go').onclick=function(){
    if(!tSel.value){tSel.focus();return;}
    S.teacher=tSel.value; S.month=document.getElementById('mSel').value;
    var p=document.getElementById('pin'); S.pin=p?p.value.trim():'';
    call('webHome',[S.teacher,S.pin,S.month],function(h){ store('albaraem_teacher',S.teacher); store('albaraem_pin',S.pin); gotHome(h); renderHome(); });
  };
}
// phone back button: inside a page it goes to the home page (asking first if something is unsaved) instead of closing the app
var navOn=false;
window.addEventListener('popstate',function(){
  navOn=false;
  if(S.view==='home'||S.view==='login') return;
  if(S.dirty && !confirm(LEAVE)){ navMark(); return; }
  setDirty(false); goHome();
});

function clsKey(c,sup){ return hkey()+'|'+(sup?'sup|':'')+c; }
function openClass(c,sup){
  S.asSup=!!sup; sup=S.asSup;
  var ck=clsKey(c,sup);
  function show(d){
    S.cls=c; S.data=d; S.acad=clone(d.acad); S.edu=clone(d.edu); S.det=clone(d.det);
    S.orig={acad:clone(d.acad),edu:clone(d.edu),det:clone(d.det)}; S.open={};
    var rs=store('albaraem_subj|'+S.teacher+'|'+c); S.subject=(rs && d.subjects.indexOf(rs)>=0)? rs : (d.subjects[0]||''); S.si=0; S.quick=0; S.group=0; S.item=0; S.allItems=false;
    if(S.tab!=='grades'&&S.tab!=='quick'&&S.tab!=='edu') S.tab='grades';
    if(sup){ S.tab='edu'; S.subject=''; }
    S.view='class'; setDirty(false); render();
  }
  if(S.classes[ck]){ show(S.classes[ck]); return; }   // only this teacher writes these rows, so the session copy stays right
  var t0=Date.now(), dk0=S.teacher+'|'+S.month+'|'+(sup?'sup|':'')+c;
  call('webLoadClass',[S.teacher,S.pin,S.month,c].concat(sup?['sup']:[]),function(d){ if(obDone[dk0]>t0){ openClass(c,sup); return; } d=withPending(d,c,sup); S.classes[ck]=d; show(d); });
}
/** After the home page: load the classes the teacher already works on in the background, one at a time, so «تعديل» opens at once. */
function prefetchClasses(){
  if(prefetchClasses.on || !S.home || !S.home.classes) return;
  var k=hkey(), list=S.home.classes.map(function(x){return x.cls;}).concat(S.home.recent||[]).filter(function(c){ return !S.classes[k+'|'+c]; }).slice(0,4);
  if(!list.length) return;
  prefetchClasses.on=true;
  (function next(){
    if(!list.length || hkey()!==k || !S.pin){ prefetchClasses.on=false; return; }
    var c=list.shift();
    if(S.classes[k+'|'+c]){ next(); return; }
    var t0=Date.now(), dk0=S.teacher+'|'+S.month+'|'+c;
    call('webLoadClass',[S.teacher,S.pin,S.month,c],function(d){ if(hkey()===k && !S.classes[k+'|'+c] && !(obDone[dk0]>t0)) S.classes[k+'|'+c]=withPending(d,c,false); next(); },function(){ prefetchClasses.on=false; },true);
  })();
}

function dget(name,sub,item,f){ var o=S.det[name]&&S.det[name][dk(sub,item)]; var v=o?o[f]:''; return v==null?'':v; }
function dput(name,sub,item,f,v){ if(!S.det[name]) S.det[name]={}; var k=dk(sub,item); if(!S.det[name][k]) S.det[name][k]={lvl:'',note:''}; S.det[name][k][f]=v; setDirty(true); }

function diff(sheet){

    Object.keys(o).forEach(function(k){ var a=o[k]===undefined||o[k]===null?'':o[k], bb=b[k]===undefined||b[k]===null?'':b[k]; if(String(a)!==String(bb)){ch[k]=a; any=true;} });
    if(any) out[name]=ch;
  });
  return out;
}
function diffDet(){
  var out={};
  Object.keys(S.det).forEach(function(name){
    var o=S.det[name], b=S.orig.det[name]||{}, ch={}, any=false;
    Object.keys(o).forEach(function(k){
      var a=o[k]||{}, bb=b[k]||{}, c={}, has=false;
      ['lvl','note'].forEach(function(f){ var x=a[f]==null?'':a[f], y=bb[f]==null?'':bb[f]; if(String(x)!==String(y)){c[f]=x; has=true;} });

/* Instant save: the change is kept on the phone first (outbox) and sent in the background, in order, with retries.
   The teacher never waits for the server; a save that has not arrived yet is shown in a strip and resent automatically. */
var obDone={};   // when a save last reached the file, per teacher|month|class (a class load older than that is thrown away)
function obGet(){ return jget('albaraem_outbox')||[]; }
function obSet(a){ jput('albaraem_outbox',a); obStrip(); }
function obCount(){ return obGet().length; }
function obStrip(){
  var a=obGet(), el=document.getElementById('obStrip');
  if(!el){ el=document.createElement('div'); el.id='obStrip'; el.className='obstrip'; el.onclick=function(){ var e=obGet()[0];
    if(e && e.err && !confirm('هذا الحفظ لم يُقبل:\n'+e.err+'\n\nموافق = أعد المحاولة الآن\nإلغاء = خيارات أخرى')){
      if(confirm('هل تريد حذف هذا الحفظ من الهاتف نهائيًا؟ لن تصل تغييراته إلى الملف.')){ var b=obGet(); b.shift(); obSet(b); obFlush(); }
      return; }
    obFlush(true); }; document.body.appendChild(el); }
  if(!a.length){ if(!obStrip.note) el.style.display='none'; return; }
  var err=a.filter(function(x){return x.err;})[0];
  el.style.display='block';
  el.className='obstrip'+(err?' bad':'');
  el.innerHTML = err ? '⚠️ حفظ لم يُقبل: '+esc(err.err)+' <u>اضغط للمحاولة</u>' :
    (obFlush.on ? '⏳ يُرسل الحفظ… ('+a.length+')' : '⏳ '+a.length+' حفظ بانتظار الإنترنت — يُرسل تلقائيًا <u>أرسل الآن</u>');
}
function obFlush(force){
  if(obFlush.on) return;
  var a=obGet(); if(!a.length){ obStrip(); return; }
  var x=a[0];
  if(x.err && !force){ obStrip(); return; }
  obFlush.on=true; obStrip();
  var px=JSON.parse(JSON.stringify(x.p)); px.sid=x.id;
  call('webSave',[px],function(r){
    obFlush.on=false; obDone[x.p.teacher+'|'+x.p.month+'|'+(x.p.as==='sup'?'sup|':'')+x.p.cls]=Date.now();
    var b=obGet(); if(b.length && b[0].id===x.id) b.shift(); obSet(b);
    if(r && r.rejected) obNote('⚠️ '+r.rejected+' قيمة لم تُقبل في '+x.p.cls+' (خارج المدى)', 6000);
    else if(!b.length) obNote('✓ وصل الحفظ إلى الملف', 1800);
    if(b.length) setTimeout(function(){ obFlush(); },50);
  },function(m){
    obFlush.on=false;
    var b=obGet(), net=!/رمز الدخول|لا يوجد رمز|شهر غير معروف|صف غير معروف|غير موجود/.test(m||'');   // only these can never succeed
    if(b.length && b[0].id===x.id){ b[0].n=(b[0].n||0)+1; if(!net) b[0].err=m||'خطأ'; else delete b[0].err; }
    obSet(b);
    if(net) setTimeout(function(){ obFlush(); }, Math.min(60000, 4000*Math.pow(2,Math.min(4,(b[0]&&b[0].n)||1))));
  },true);
}
function obNote(m,ms){ obStrip(); var el=document.getElementById('obStrip'); obStrip.note=true; el.className='obstrip ok'; el.style.display='block'; el.textContent=m;
  clearTimeout(obNote.t); obNote.t=setTimeout(function(){ obStrip.note=false; obStrip(); }, ms||2000); }
window.addEventListener('online',function(){ obFlush(true); });
/** A class loaded from the server, with this phone's not-yet-sent changes applied on top. */
function withPending(d,cls,sup){
  obGet().forEach(function(x){ var p=x.p; if(p.teacher!==S.teacher||p.month!==S.month||p.cls!==cls||(p.as==='sup')!==!!sup) return;
    ['acad','edu'].forEach(function(sh){ Object.keys(p[sh]||{}).forEach(function(n){ var o=d[sh][n]=d[sh][n]||{}; Object.keys(p[sh][n]).forEach(function(k){ o[k]=p[sh][n][k]; }); }); });
    Object.keys(p.det||{}).forEach(function(n){ var o=d.det[n]=d.det[n]||{}; Object.keys(p.det[n]).forEach(function(k){ var c=o[k]=o[k]||{lvl:'',note:''}; Object.keys(p.det[n][k]).forEach(function(f){ c[f]=p.det[n][k][f]; }); }); });
  });
  return d;
}
/** A grade out of 100 that was entered or changed needs a note (why this grade). Returns the first student missing one. */
function missingGradeNote(){

  d.subjects.some(function(sub){ return d.students.some(function(st){
    var g=val('acad',st.name,sub), g0=((S.orig.acad[st.name]||{})[sub]); g0=g0==null?'':g0;
    if(g===''||String(g)===String(g0)) return false;
    if(String(dget(st.name,sub,d.gradeItem,'note')).trim()!=='') return false;
    miss={sub:sub, st:st}; return true; }); });
  return miss;
}
/** A subject whose new or changed grades (3 or more) are all 25 or less: probably written out of 10/20/25, not 100. */
function lowGrades(){

  d.subjects.some(function(sub){ var vals=[];
    d.students.forEach(function(st){ var g=val('acad',st.name,sub), g0=(S.orig.acad[st.name]||{})[sub]; if(g!=='' && String(g)!==String(g0==null?'':g0)) vals.push(Number(g)); });
    if(vals.length>=3 && Math.max.apply(null,vals)<=25){ hit=sub; return true; } return false; });
  return hit;
}
function saveClass(){
  var mg=missingGradeNote();

  var p={teacher:S.teacher,pin:S.pin,month:S.month,cls:S.cls,acad:diff('acad'),edu:diff('edu'),det:diffDet()};
  if(S.asSup){ p.as='sup'; p.acad={}; p.det={}; }
  if(!Object.keys(p.acad).length && !Object.keys(p.edu).length && !Object.keys(p.det).length){ setDirty(false); return; }
  var id=Date.now().toString(36)+Math.random().toString(36).slice(2,7), a=obGet(); a.push({id:id, p:p, at:Date.now(), n:0}); obSet(a);
  if(!obGet().some(function(x){ return x.id===id; })){          // storage full or blocked: wait for the server instead
    var pd=JSON.parse(JSON.stringify(p)); pd.sid=id;
    call('webSave',[pd],function(r){ savedLocal(); if(r.rejected) status('err','حُفظ، لكن '+r.rejected+' قيمة لم تُقبل. راجع الخانات.'); else status('ok','تم الحفظ ✓'); });
    return;
  }
  savedLocal();
  status('ok','تم الحفظ ✓ — يُرسل إلى الملف في الخلفية، ويمكنك المتابعة فورًا');
  obFlush();
}
function savedLocal(){

    h+='<div class="legend">1 ضعيف جدًا · 2 ضعيف · 3 مقبول · 4 جيد · 5 ممتاز — قيّم ما تعرفه فقط.</div>'+
      '<div class="grid2"><div><label class="f">'+esc(I.extra.contacts)+'</label><input type="number" min="0" max="99" inputmode="numeric" id="fCt" value="'+esc(f.contacts)+'"></div>'+
      '<div><label class="f">'+esc(I.extra.meetings)+'</label><input type="number" min="0" max="99" inputmode="numeric" id="fMt" value="'+esc(f.meetings)+'"></div></div>'+
      '<label class="f">'+esc(I.extra.agreed)+'</label><textarea class="t" id="fAg" style="width:100%;min-height:52px;padding:8px 10px;border:1px solid var(--line);border-radius:9px">'+esc(f.agreed)+'</textarea>'+
      '<label class="f">'+esc(I.extra.notes)+'</label><textarea class="t" id="fNo" style="width:100%;min-height:52px;padding:8px 10px;border:1px solid var(--line);border-radius:9px">'+esc(f.notes)+'</textarea></div>';
    if(trait) h+='<div class="card"><h2>صفات الطفل (للتمهيدي)</h2><div class="hint" style="margin-top:0">لا توجد معلومات سابقة عن أطفال التمهيدي؛ ما تكتبه هنا يظهر في بطاقة الطالب، و«أسوأ صفة» تصير الصفة المستهدفة التي يتابعها المعلمون.</div>'+
      '<label class="f">أحسن صفة</label><input type="text" id="fBe" value="'+esc(f.best)+'">'+
      '<label class="f">أسوأ صفة (تحتاج علاجًا)</label><input type="text" id="fWo" value="'+esc(f.worst)+'"></div>';
  } else if(f.student) h+='<div class="card empty">جارٍ التحميل…</div>';
  app.innerHTML=h;
  document.getElementById('back').onclick=function(){ leave(goHome); };
  document.getElementById('fM').onchange=function(){ leave(function(){ f.month=document.getElementById('fM').value; f.loaded=false; if(f.student) famLoad(); else renderFam(); }); };
  document.getElementById('fC').onchange=function(){ var c=this.value; leave(function(){ f.cls=c; f.student=''; f.loaded=false; renderFam(); }); };
  document.getElementById('fS').onchange=function(){ var s=this.value; leave(function(){ f.student=s; f.loaded=false; if(s) famLoad(); else renderFam(); }); };
  app.querySelectorAll('[data-fi]').forEach(function(b){ b.onclick=function(){ var k=I.items[+b.getAttribute('data-fi')], n=+b.getAttribute('data-v');
    f.items[k]=String(f.items[k])===String(n)?'':n; setDirty(true); keep(renderFam); }; });
  [['fCt','contacts'],['fMt','meetings'],['fAg','agreed'],['fNo','notes'],['fBe','best'],['fWo','worst']].forEach(function(x){
    var e=document.getElementById(x[0]); if(e) e.oninput=function(){ f[x[1]]=e.value; setDirty(true); }; });
}
function saveFam(){
  var f=S.f; if(!f||!f.student){ status('err','اختر الصف والطالب.'); return; }
  var p={sup:S.teacher,pin:S.pin,month:f.month,cls:f.cls,student:f.student,items:f.items,contacts:f.contacts,meetings:f.meetings,agreed:f.agreed,notes:f.notes,best:f.best,worst:f.worst};
  call('webFamSave',[p],function(){ setDirty(false); f.found=true; status('ok','تم حفظ المقابلة ✓'); delete S.homes[hkey()]; S.classes={}; });
}
function opt(list,cur,ph){ var h='<option value="">'+esc(ph)+'</option>'; list.forEach(function(x){h+='<option'+(x===cur?' selected':'')+'>'+esc(x)+'</option>';}); return h; }
function renderVisit(){
  who();
  var I=S.vinit, v=S.v;
  document.getElementById('savebar').style.display='block'; document.getElementById('saveBtn').style.display='';
  document.getElementById('saveBtn').textContent='حفظ الزيارة';
  var subs = v.cls ? (I.subjects[v.cls]||[]) : [];
  var h='<div class="card"><h2>'+(v.id?'تعديل زيارة':'زيارة حصة جديدة')+'<span class="grow"></span><button class="fill" id="back">رجوع</button></h2>'+
    (v.id?'<div class="banner" style="margin-top:0">تظهر الزيارة كما حفظتها؛ عدّل ثم اضغط «حفظ الزيارة» — يتحدّث سجلها نفسه.</div>':'')+
    '<div class="grid2"><div><label class="f">تاريخ الحصة</label><input type="date" id="vDate" value="'+esc(v.date)+'"></div>'+
    '<div><label class="f">الصف</label><select id="vCls">'+opt(I.classes,v.cls,'— اختر الصف —')+'</select></div>'+
    '<div><label class="f">المادة</label><select id="vSub">'+opt(subs,v.subject,v.cls?'— اختر المادة —':'اختر الصف أولًا')+'</select></div>'+
    '<div><label class="f">المعلم/ة</label><select id="vT">'+opt(I.teachers,v.teacher,'— اختر —')+'</select></div></div>'+
    '<label class="f">عنوان الدرس (اختياري)</label><input type="text" id="vL" value="'+esc(v.lesson)+'"></div>';
  // teacher evaluation
  var tq=I.tq && v.subject===I.tq.subject, tItems=vItems();
  h+='<div class="card"><h2>'+(tq?'تقييم حصة التلقين (1–5)':'تقييم أداء المعلم/ة في الحصة (1–5)')+'</h2>';
  v.inotes=v.inotes||{}; S.vOpen=S.vOpen||{};
  tItems.forEach(function(k,i){
    var x=v.items[k], nt=v.inotes[k]||''; h+='<div class="trow"><div class="lab">'+esc(k)+(I.inotes?'<button class="nb'+(nt?' has':'')+'" data-tn="'+i+'" title="ملاحظة اختيارية على هذا البند">✎'+(nt?' ملاحظة':'')+'</button>':'')+'</div><div class="sc">';
    for(var n=1;n<=5;n++) h+='<button data-ti="'+i+'" data-v="'+n+'"'+(String(x)===String(n)?' class="on"':'')+'>'+n+'</button>';
    h+='</div>';
    if(nt||S.vOpen[k]) h+='<div class="noteRow"><textarea data-tnt="'+i+'" placeholder="ملاحظة اختيارية على هذا البند">'+esc(nt)+'</textarea></div>';
    h+='</div>';
  });
  I.texts.forEach(function(k,i){ h+='<label class="f">'+esc(k)+'</label><textarea class="t" style="width:100%;min-height:52px;padding:8px 10px;border:1px solid var(--line);border-radius:9px" data-tx="'+i+'">'+esc(v.texts[k]||'')+'</textarea>'; });
  h+='<div class="legend">1 ضعيف جدًا · 2 ضعيف · 3 مقبول · 4 جيد · 5 ممتاز</div></div>';
  // students
  h+='<div class="card"><h2>تقييم الطلاب في الحصة</h2>';
  if(!v.cls) h+='<div class="hint" style="margin-top:0">اختر الصف ليظهر الطلاب.</div>';
  else {
    var st=I.students[v.cls]||[], items=I.stu.map(function(x){return {key:x.key,label:x.label};}).concat([{key:I.stuNote,label:'ملاحظة',text:true}]);
    if(S.vItem>=items.length) S.vItem=0;
    h+='<div class="chips small">';
    items.forEach(function(it,i){ var n=st.filter(function(s){return vval(s,it.key)!=='';}).length;
      h+='<button class="chip'+(i===S.vItem?' on':'')+'" data-vi="'+i+'">'+esc(it.label)+(n?'<span class="n">'+n+'/'+st.length+'</span>':'')+'</button>'; });
    h+='</div>';
    var it=items[S.vItem];
    h+='<div class="bar"><span><b>'+esc(it.text?'ملاحظة على الطالب (اختياري)':it.key)+'</b></span><span class="grow"></span>'+(it.text?'':'<button class="fill" id="vfill">عبّئ الفارغ بـ 4</button>')+'</div><div class="list">';
    st.forEach(function(name,i){
      var x=vval(name,it.key);
      h+='<div class="row'+(x!==''?' done':'')+'"><div class="nm"><b>'+esc(name)+'</b></div>';
      if(it.text) h+='<textarea class="t" data-vn="'+i+'" placeholder="اختياري">'+esc(x)+'</textarea>';
      else { h+='<div class="sc">'; for(var n=1;n<=5;n++) h+='<button data-vr="'+i+'" data-v="'+n+'"'+(String(x)===String(n)?' class="on"':'')+'>'+n+'</button>'; h+='</div>'; }
      h+='</div>';
    });
    h+='</div><div class="legend">قيّم من لاحظته فقط، واترك الباقي فارغًا.</div>';
  }
  h+='</div>';
  if(v.id) h+='<div style="margin-top:14px;text-align:left"><button class="btn danger sm" id="vDel">حذف هذه الزيارة</button></div>';
  app.innerHTML=h;
  bindVisit();
}
/** Talqeen lessons have their own teacher items. */
function vItems(){ var I=S.vinit; return (I.tq && S.v.subject===I.tq.subject) ? I.tq.items : I.items; }
function vval(name,key){ var o=S.v.students[name]; return o && o[key]!=null ? o[key] : ''; }
function vput(name,key,x){ if(!S.v.students[name]) S.v.students[name]={}; S.v.students[name][key]=x; setDirty(true); }
function bindVisit(){
  var I=S.vinit, v=S.v;
  document.getElementById('back').onclick=function(){ leave(goHome); };
  document.getElementById('vDate').onchange=function(){ v.date=this.value; setDirty(true); };
  document.getElementById('vCls').onchange=function(){ v.cls=this.value; v.subject=''; v.students={}; setDirty(true); keep(renderVisit); };
  document.getElementById('vSub').onchange=function(){ var was=vItems(); v.subject=this.value; setDirty(true); if(vItems()!==was) keep(renderVisit); };
  document.getElementById('vT').onchange=function(){ v.teacher=this.value; setDirty(true); };
  document.getElementById('vL').oninput=function(){ v.lesson=this.value; setDirty(true); };
  app.querySelectorAll('[data-ti]').forEach(function(b){ b.onclick=function(){ var k=vItems()[+b.getAttribute('data-ti')], n=+b.getAttribute('data-v');
    v.items[k] = String(v.items[k])===String(n) ? '' : n; setDirty(true); keep(renderVisit); }; });
  app.querySelectorAll('[data-tx]').forEach(function(t){ t.oninput=function(){ v.texts[I.texts[+t.getAttribute('data-tx')]]=t.value; setDirty(true); }; });
  app.querySelectorAll('[data-tn]').forEach(function(b){ b.onclick=function(){ var k=vItems()[+b.getAttribute('data-tn')]; S.vOpen[k]=!S.vOpen[k]; keep(renderVisit);
    var t=app.querySelector('[data-tnt="'+b.getAttribute('data-tn')+'"]'); if(t) t.focus(); }; });
  app.querySelectorAll('[data-tnt]').forEach(function(t){ t.oninput=function(){ v.inotes[vItems()[+t.getAttribute('data-tnt')]]=t.value; setDirty(true); }; });
  app.querySelectorAll('[data-vi]').forEach(function(b){ b.onclick=function(){ S.vItem=+b.getAttribute('data-vi'); keep(renderVisit); }; });
  var st=v.cls?(I.students[v.cls]||[]):[], keyOf=function(){ return S.vItem<I.stu.length ? I.stu[S.vItem].key : I.stuNote; };
  app.querySelectorAll('[data-vr]').forEach(function(b){ b.onclick=function(){ var name=st[+b.getAttribute('data-vr')], n=+b.getAttribute('data-v'), k=keyOf();
    vput(name,k, String(vval(name,k))===String(n)?'':n); keep(renderVisit); }; });
  app.querySelectorAll('[data-vn]').forEach(function(t){ t.oninput=function(){ vput(st[+t.getAttribute('data-vn')],I.stuNote,t.value); }; });
  var f=document.getElementById('vfill'); if(f) f.onclick=function(){ var k=keyOf(); st.forEach(function(name){ if(vval(name,k)==='') vput(name,k,4); }); keep(renderVisit); };
  var del=document.getElementById('vDel'); if(del) del.onclick=function(){
    if(!confirm('حذف هذه الزيارة نهائيًا مع تقييمات طلابها؟')) return;
    call('webDeleteVisit',[S.teacher,S.pin,v.id],function(){ setDirty(false); delete S.homes[hkey()]; goHome(); });
  };
}
function saveVisit(){
  var v=S.v;
  if(!v.date){ status('err','اكتب تاريخ الحصة.'); return; }
  if(!v.cls||!v.subject||!v.teacher){ status('err','اختر الصف والمادة والمعلم/ة.'); return; }
  var p={sup:S.teacher,pin:S.pin,id:v.id,date:v.date,cls:v.cls,subject:v.subject,teacher:v.teacher,lesson:v.lesson,items:v.items,texts:v.texts,inotes:v.inotes||{},students:v.students};
  call('webSaveVisit',[p],function(r){
    v.id=r.id; S.dirty=false; document.getElementById('saveBtn').disabled=true; delete S.homes[hkey()];
    status('ok','حُفظت الزيارة ✓ ('+r.students+' طالبًا'+(r.index!==''?'، مؤشر المعلم '+r.index:'')+')'+(r.counted?'':' — التاريخ خارج أشهر المتابعة فلم يدخل في مؤشرات الطلاب'));
    keep(renderVisit);
  });
}

document.getElementById('saveBtn').onclick=function(){ if(busy>0) return; if(S.view==='visit') saveVisit(); else if(S.view==='tasks') saveTasks(); else if(S.view==='tg') saveTg(); else if(S.view==='fam') saveFam(); else saveClass(); };
start();
</script>
<script>if('serviceWorker' in navigator){addEventListener('load',function(){navigator.serviceWorker.register('sw.js');});}</script>
</body>
