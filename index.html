<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>مدرسة البراعم — صفحة المعلم</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f5e3b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="البراعم">
<meta name="robots" content="noindex,nofollow">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Aref+Ruqaa:wght@700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Aref+Ruqaa:wght@700&display=swap" rel="stylesheet"></noscript>
<style>
:root{
  --ink:#17301f; --muted:#5e7065; --line:#dce5de; --bg:#f5f7f4; --card:#ffffff;
  --brand:#1f5e3b; --brand2:#24704a; --soft:#e6f0ea; --accent:#b8862b; --gold:#b8862b;
  --ok:#1e7b34; --warn:#c0392b;
  --r1:#f3b2b2; --r2:#f6cfa8; --r3:#fbe7a1; --r4:#cde8b5; --r5:#9bd3a5;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;font-size:15px;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 14px 110px}
header.top{background:var(--brand);color:#fff;padding:12px 16px 14px;padding-top:max(12px,env(safe-area-inset-top))}
header.top .logo{width:42px;height:42px;flex-shrink:0;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;border:2px solid var(--gold)}
header.top .logo svg{width:30px;height:30px;display:block}
header.top .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px}
header.top h1{font-family:'Aref Ruqaa',serif;font-size:24px;line-height:1.15;margin:0;font-weight:700}
header.top small{display:block;opacity:.8;font-size:12.5px;font-weight:400}
header.top .who{margin-inline-start:auto;text-align:left;font-size:13px;opacity:.95;line-height:1.7}
header.top .who a{color:#fff;opacity:.85;cursor:pointer;text-decoration:underline;margin-inline-start:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px}
.card h2{font-size:15px;margin:0 0 12px;color:var(--brand);display:flex;align-items:center;gap:8px}
.card h2 .grow{flex:1}
label.f{display:block;font-size:13px;color:var(--muted);margin:10px 0 6px}
select,input[type=password],input[type=text],input[type=date],.grid2 input[type=number]{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
.btn{border:0;border-radius:10px;padding:12px 16px;background:var(--brand2);color:#fff;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:#fff;color:var(--brand2);border:1px solid var(--brand2)}
.btn.sm{padding:7px 12px;font-size:13px}
.btn.danger{background:#fff;color:var(--warn);border:1px solid var(--warn)}
.btn.block{width:100%;margin-top:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;cursor:pointer;font-size:14px}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chip.done{border-color:#9cc77d}
.chip .n{font-size:11.5px;opacity:.75;margin-inline-start:4px}
.chips.small .chip{padding:6px 11px;font-size:13px}
.tabs{display:flex;background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px;margin-top:14px;position:sticky;top:0;z-index:5}
.tab{flex:1;border:0;background:transparent;padding:10px 6px;border-radius:9px;cursor:pointer;font-weight:600;color:var(--muted);font-size:14px}
.tab.on{background:var(--soft);color:var(--brand)}
.sub{margin-top:12px}
.sub .lbl{font-size:12.5px;color:var(--muted);margin-bottom:6px}
.bar{display:flex;align-items:center;gap:10px;margin:14px 2px 6px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.bar .grow{flex:1}
.bar .fill{border:1px dashed var(--brand2);color:var(--brand2);background:#fff;border-radius:8px;padding:5px 10px;cursor:pointer;font-size:12.5px}
.list{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:8px;padding:10px 12px;border-top:1px solid var(--line);flex-wrap:wrap}
.list > .row:first-child{border-top:0}
.row .nm{flex:1;min-width:0}
.row .nm b{display:block;font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm i{display:block;font-style:normal;font-size:12px;color:var(--warn);margin-top:2px}
.row .nm i.none{color:var(--muted)}
.row .nm small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.row.done{background:#fbfefb}
.sc{display:flex;gap:5px;flex-shrink:0}
.sc button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:600;padding:0}
.sc button.on[data-v="1"]{background:var(--r1);border-color:#e08f8f}
.sc button.on[data-v="2"]{background:var(--r2);border-color:#e0ad80}
.sc button.on[data-v="3"]{background:var(--r3);border-color:#dfc66a}
.sc button.on[data-v="4"]{background:var(--r4);border-color:#9cc77d}
.sc button.on[data-v="5"]{background:var(--r5);border-color:#6fb67c}
.grade{width:84px;flex-shrink:0;padding:9px 8px;border:1px solid var(--line);border-radius:9px;text-align:center;font-weight:600;background:#fff}
.grade.bad{border-color:var(--warn);background:#fdecea}
.nb{flex-shrink:0;border:1px solid var(--line);background:#fff;border-radius:9px;height:34px;padding:0 9px;cursor:pointer;font-size:12.5px;color:var(--muted)}
.nb.has{border-color:var(--accent);color:var(--accent);background:#fffaf0;font-weight:600}
.sc.four button{min-width:0;width:auto;flex:1;height:auto;min-height:44px;padding:4px 2px;font-size:12px;line-height:1.2;display:flex;flex-direction:column;align-items:center;justify-content:center}
.sc.four button small{font-size:11px;opacity:.65;margin-top:2px}
.row.wrap4{flex-wrap:wrap}
.row.wrap4 .nm{flex-basis:calc(100% - 50px)}
.row.wrap4 .sc.four{order:3;flex-basis:100%;margin-top:6px}
.obstrip{display:none;position:fixed;bottom:calc(84px + env(safe-area-inset-bottom,0px));inset-inline:10px;z-index:60;background:#fff8e1;border:1px solid #f0d27a;color:#6b5200;border-radius:12px;padding:8px 12px;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.08);cursor:pointer;text-align:center}
.obstrip.ok{background:#eaf6ec;border-color:#9fd1a8;color:#1d5b2a}
.obstrip.bad{background:#fdecec;border-color:#eba4a4;color:#8a1f1f}
textarea.need{border-color:#d9534f;box-shadow:0 0 0 3px rgba(217,83,79,.15)}
input.grade.need{border-color:#d9534f;box-shadow:0 0 0 3px rgba(217,83,79,.15)}
.noteRow{flex-basis:100%;display:flex}
.noteRow textarea,.row textarea.t{flex:1;min-height:40px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;resize:vertical;background:#fff}
.row textarea.t{flex:1.4}
.legend{font-size:12px;color:var(--muted);margin:8px 2px 0}
.empty{padding:26px;text-align:center;color:var(--muted)}
.banner{background:#fffaf0;border:1px solid #ecd9a8;color:#6b5414;border-radius:12px;padding:10px 12px;margin-top:12px;font-size:13px;line-height:1.7}
.badge{display:inline-block;background:var(--soft);color:var(--brand);border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600}
.trow{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.trow:first-child{border-top:0}
.trow .lab{flex:1;min-width:170px;font-size:14px}
.trow .lab .nb{height:26px;padding:0 7px;margin-inline-start:6px;vertical-align:middle;font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
footer.save{position:fixed;bottom:0;inset-inline:0;background:rgba(255,255,255,.98);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));z-index:10}
footer.save .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px}
footer.save .st{flex:1;font-size:13px;color:var(--muted)}
footer.save .st.dirty{color:var(--accent);font-weight:600}
footer.save .st.ok{color:var(--ok);font-weight:600}
footer.save .st.err{color:var(--warn);font-weight:600}
.loading{position:fixed;inset:0;background:rgba(245,247,244,.7);display:none;align-items:center;justify-content:center;z-index:20;font-weight:600;color:var(--brand)}
.loading.on{display:flex;animation:veil .18s .25s backwards}   /* quick answers never flash the veil; taps are still held from the first moment */
@keyframes veil{from{opacity:0}}
.att .times div.wait b{opacity:.45}
.att .times.skel b{background:#e3eae4;border-radius:6px;width:56%;margin:5px auto 2px;height:22px}
.lslots .dn.w{background:transparent;color:var(--muted);border:2px dashed #b9c6bc}
@media (prefers-reduced-motion:no-preference){
  :root{--t1:90ms;--t2:180ms;--t3:320ms;--out:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.2,1.5,.4,1)}
  .btn,.fill,.wbtn,.stile,.tkh,.roles button,.opts button{transition:transform var(--t1) var(--out)}
  .btn:not(:disabled):active,.fill:active,.roles button:active,.opts button:active{transform:scale(.96)}
  /* the server confirmed the time: the stamp lands */
  .att .times div.just{animation:stampbg .9s var(--out)}
  .att .times div.just b{animation:stamp var(--t3) var(--spring)}
  @keyframes stamp{from{transform:scale(1.35);opacity:.3}}
  @keyframes stampbg{from{background:#f6e3a1}}
  /* a lesson reached the server */
  .lslots .dn.just,.ldots i.just{animation:pop var(--t3) var(--spring)}
  @keyframes pop{from{transform:scale(.3);opacity:0}}
  .lbar i.grow{animation:barw .5s var(--out)}
  @keyframes barw{from{width:var(--w0)}}
  footer.save .st.ok{animation:rise var(--t2) var(--out)}
  @keyframes rise{from{opacity:0;transform:translateY(5px)}}
  .nbk.open{animation:nbopen var(--t3) var(--out)}
  @keyframes nbopen{from{opacity:0;transform:translateY(10px) scale(.985)}}
  .tkc.open .tkb{animation:unfold var(--t2) var(--out)}
  /* the letter goes into the envelope only once the school has it */
  .letter.fold{transition:transform var(--t3) var(--out),opacity var(--t3) var(--out);transform:translateY(10px) scale(.9);opacity:0}
  .pmdone.sent .pmseal{animation:pop var(--t3) var(--spring) .1s backwards}
  .pmdone.sent h2,.pmdone.sent .pmticket{animation:rise var(--t2) var(--out) .2s backwards}
  .pmbdg{animation:pop var(--t3) var(--spring)}
  @keyframes unfold{from{opacity:0;transform:translateY(-4px)}}
}
.hint{font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.7}
.install{border-color:#e6d5ad;background:#fffbf2}
.att .big{display:flex;gap:10px;margin-top:12px}
.att .big .btn{flex:1;padding:14px 10px;font-size:16px}
.att .times{display:flex;gap:10px;margin-top:10px}
.att .times div{flex:1;background:var(--soft);border-radius:10px;padding:8px 10px;text-align:center}
.att .times b{display:block;font-size:20px;color:var(--brand)}
.att .times small{color:var(--muted);font-size:12px}
.att textarea,.why{width:100%;min-height:44px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;margin-top:6px;background:#fff}
.warn{color:var(--warn);font-weight:600}
.okc{color:var(--ok);font-weight:600}
.roles{display:flex;flex-wrap:wrap;gap:8px}
.tri{min-width:62px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 8px;cursor:pointer;font-size:12.5px;line-height:1.4}
.tri small{display:block;color:var(--muted);font-size:11px}
.tri.yes{background:var(--r5);border-color:#6fb67c}
.tri.no{background:var(--r1);border-color:#e08f8f}
.opts{display:flex;gap:4px;flex-wrap:wrap}
.opts button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 8px;font-size:12.5px;cursor:pointer}
.opts button.on.s0{background:var(--r5);border-color:#6fb67c}
.opts button.on.s1{background:var(--r3);border-color:#dfc66a}
.opts button.on.s2{background:var(--r1);border-color:#e08f8f}
.opts button.on.s3{background:#e5e9ea;border-color:#b9c3c5}
.tin{width:96px;padding:7px 6px;border:1px solid var(--line);border-radius:8px;background:#fff;text-align:center}
.dimrow{opacity:.6}
.row.mt .nm b{white-space:normal}
.mty{display:flex;gap:6px;flex-wrap:wrap}
.mty button{flex:1;min-width:120px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 8px;cursor:pointer;font-size:13.5px}
.mty button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.mstat{font-size:13.5px;line-height:1.9}
.install h2{color:var(--gold)}
.card{border-radius:16px}
.card h2{font-family:'Aref Ruqaa',serif;font-size:20px;line-height:1.4}
.card h2 button,.card h2 a,.card h2 .badge,.card h2 select{font-family:"IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;font-size:14px;line-height:1.5}
.greet{padding:22px 4px 0}
.greet b{display:block;font-family:'Aref Ruqaa',serif;font-size:29px;line-height:1.3;color:var(--brand)}
.greet span{display:block;color:var(--muted);font-size:14px}
.card.lhero{position:relative;background:var(--brand);border:0;color:#fff;border-radius:20px 8px 8px 20px;padding:18px 30px 18px 16px;overflow:hidden;box-shadow:0 12px 24px -14px rgba(23,48,31,.7)}
.card.lhero:before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:14px;background:#17472c}
.lh1 b{display:block;font-family:'Aref Ruqaa',serif;font-size:29px;line-height:1.3}
.lh1 span{display:block;font-size:13.5px;opacity:.88}
.ldots{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.ldots i{width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:700;font-size:14px}
.ldots i.d{background:#f2c230;border-color:#f2c230;color:#3a2a00}
.lhw{margin-top:10px;font-size:12.5px;background:rgba(255,255,255,.14);border-radius:10px;padding:6px 10px}
.lhb{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.lhb button{flex:1;border:0;border-radius:12px;padding:12px;background:#fff;color:var(--brand);font-weight:700;cursor:pointer}
.lhb button.g{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.6)}
.tkbar{display:flex;gap:8px;margin-top:14px;align-items:center}
.tkbar input{flex:1;margin:0}
.tkc{margin-top:10px;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tkc.full{border-color:#b9d8c5}
.tkh{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:13px 14px;cursor:pointer;text-align:start;color:var(--ink)}
.tkh b{flex:1;min-width:0;font-size:15.5px}
.tkh span{font-size:12.5px;font-weight:600;color:var(--muted);background:var(--soft);border-radius:999px;padding:2px 10px;direction:ltr}
.tkc.full .tkh span{background:var(--ok);color:#fff}
.tkh i{font-style:normal;color:var(--muted);font-size:13px}
.tkb{padding:0 14px 14px}
.tkg{font-size:12.5px;font-weight:700;color:var(--brand2);margin:10px 0 6px}
.tki{font-size:12.5px;color:var(--muted);line-height:1.7;margin-bottom:6px}
.tkr{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px dashed var(--line)}
.tkr > span{flex:1;min-width:0;font-size:14px}
.tkr > span u{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--cv);margin-inline-end:7px}
.tkr .roles{flex-shrink:0;flex-wrap:nowrap}
.tkr .tri{min-width:58px}
.ltop{padding:22px 4px 0}
.ltop b{display:block;font-family:'Aref Ruqaa',serif;font-size:31px;line-height:1.3;color:var(--brand)}
.ltop span{display:block;color:var(--muted);font-size:14px}
.dstrip{display:flex;gap:8px;margin-top:14px}
.dstrip .chip{flex:1;border-radius:14px;padding:8px 2px 7px;text-align:center;line-height:1.25}
.dstrip .chip small{display:block;font-size:11.5px;opacity:.85}
.dstrip .chip b{display:block;font-size:19px}
.dstrip .chip u{display:block;text-decoration:none;font-size:10.5px;font-weight:600;color:var(--gold)}
.dstrip .chip.on u{color:#f1d596}
.lbar{height:8px;border-radius:99px;background:var(--soft);margin-top:16px;overflow:hidden}
.lbar i{display:block;height:100%;background:#f2c230;border-radius:99px}
.lbt{font-size:12.5px;color:var(--muted);margin-top:5px}
.lslots{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.lslots .row{background:#fff;border:1.5px dashed #c7d3ca;border-radius:16px;padding:12px;flex-wrap:nowrap;gap:12px}
.lslots .row.done{border-style:solid;border-color:var(--line);background:#fff}
.lslots .pb{width:52px;height:56px;border-radius:14px;background:var(--cv);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:21px;line-height:1;flex-shrink:0}
.lslots .pb small{font-size:10px;font-weight:500;opacity:.9;margin-bottom:4px}
.lslots .nm b{font-size:16px;white-space:normal}
.lslots .nm small{font-size:13px}
.lslots .nm q{display:block;quotes:"«" "»";font-size:13.5px;margin-top:4px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lslots .dn{width:26px;height:26px;border-radius:50%;background:var(--ok);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0}
.lnone{margin-top:14px;border:1.5px dashed #c7d3ca;border-radius:16px;padding:18px;text-align:center;color:var(--muted)}
.ladd{width:100%;margin-top:10px;border:1.5px dashed var(--brand2);background:transparent;color:var(--brand2);border-radius:16px;padding:14px;font-weight:600;cursor:pointer}
.lform{margin-top:16px}
.lform .chg{position:relative;margin-top:10px;border:1px solid rgba(255,255,255,.65);background:transparent;color:#fff;border-radius:999px;padding:4px 12px;font-size:12.5px;cursor:pointer}
.lfb{padding:8px 16px 20px}
.lfsel{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;padding-bottom:14px;border-bottom:1px dashed var(--line)}
.lfsel[hidden]{display:none}
.lfsel .full{grid-column:1/-1}
label.lf{display:block;margin:16px 0 7px}
label.lf b{display:block;font-size:15.5px}
label.lf span{display:block;font-size:12.5px;color:var(--muted);line-height:1.6}
.lfb input#lfTitle{font-size:17px;font-weight:600;padding:13px 12px}
.lfb textarea{display:block;width:100%;resize:none;border:1px solid var(--line);border-radius:10px;padding:0 12px;line-height:32px;font-size:15.5px;overflow:hidden}
.lfb textarea.lta{min-height:130px;background:#fff repeating-linear-gradient(transparent 0,transparent 31px,#e4ecee 31px,#e4ecee 32px);background-attachment:local}
.lfb textarea.lhwt{min-height:66px;background:#fff8cf;border-color:#ecd9a8}
.lfb input:focus,.lfb textarea:focus,.lfb select:focus{outline:2px solid var(--brand2);outline-offset:1px}
.lpv{margin:22px 4px 8px;font-weight:600;color:var(--muted);font-size:13.5px}
.lhid .nm{opacity:.55}
input[type=text]#lfTitle{margin-top:0}
.row.ltext{border-top:0;padding-top:0}
.row.ltext .nm small{white-space:normal;line-height:1.7;font-size:12.5px}
.row.lrow .nm b{white-space:normal}
.c0{--cv:#2c9a67;--cd:#237b52}.c1{--cv:#3a7fc2;--cd:#2c669e}.c2{--cv:#df6a5c;--cd:#bb5246}.c3{--cv:#23a0a0;--cd:#198080}

/* ======== design pass 21-11-2026 (reviewed on 360 / 420 / 768 px) ======== */
/* ---- tokens */
:root{--fs-xs:12px;--fs-s:13px;--fs-m:15px;--fs-l:17px;--fd-s:21px;--fd-m:28px;--fd-l:34px;
  --r-s:10px;--r-m:14px;--r-l:18px;--sh-1:0 1px 0 rgba(23,48,31,.04),0 8px 18px -14px rgba(23,48,31,.35);
  --gold-ink:#8a6414;}
/* ---- header */
header.top{padding:10px 14px 12px}
header.top small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .in > div:nth-child(2){min-width:0}
header.top .who{flex-shrink:0;font-size:12.5px;line-height:1.5;white-space:nowrap}
header.top .who a{display:inline-block;margin:6px 0 0;margin-inline-start:6px;padding:3px 10px;border:1px solid rgba(255,255,255,.4);border-radius:999px;text-decoration:none;opacity:1}
/* ---- cards / links */
.card{border-radius:var(--r-l);box-shadow:var(--sh-1)}
.hint a,.lnk{color:var(--brand2);text-decoration-thickness:1px;text-underline-offset:3px}
/* ---- attendance: done state instead of a washed-out disabled button */
.att .big #pIn:disabled{opacity:1;background:var(--soft);color:var(--brand);box-shadow:inset 0 0 0 1.5px #b9d8c5}
/* ---- contrast on coloured tiles */
.c4{--ct:#8a5f0c}.c6{--ct:#4d6b1f}.c3{--ct:#146a6a}.c0{--ct:#1d6a46}.c1{--ct:#2c669e}.c2{--ct:#a8453a}.c5{--ct:#6a4aa3}.c7{--ct:#a33a6a}
.stile em.on,.stile em.sc{color:var(--ct,var(--cd))}
.stile.dim .lab{opacity:1}.stile.dim em{color:var(--muted)}
.lslots .pb{background:var(--cd)}
/* ---- shelf on tablets */
.sgrid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
/* ---- lesson-form hero: keep text clear of the doodle */
.shero{padding-inline-end:84px}
/* ---- small phones: the subject chips of the class page on one sliding line (skills keep wrapping: their names are long) */
@media (max-width:480px){
  .chips.rail{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-14px;padding:2px 14px 4px}
  .chips.rail::-webkit-scrollbar{display:none}
  .chips.rail .chip{flex:0 0 auto}
}
/* ---- signature: today's homework as a sticky note */
.pday{position:relative;background:#fff6bf;border:0;border-radius:4px 4px 10px 4px;box-shadow:0 10px 16px -12px rgba(60,45,0,.55);transform:rotate(-.6deg);margin-top:22px}
.pday:before{content:"";position:absolute;top:-9px;inset-inline-start:42%;width:74px;height:20px;background:rgba(242,194,48,.45);transform:rotate(2deg);border-radius:2px}
.pdh b{color:#5c4300}.pdh span{background:#7a5600}
.pdi{background:rgba(255,255,255,.55)}
.pdt{border-top-color:#e5cf7a}.pdt b{color:#5c4300}
.pdt .chip{background:transparent;border-style:dashed;border-color:#d9c06a;padding:5px 11px;font-size:13px}
/* ---- signature: ruled letter paper */
.pmta{background:#fff repeating-linear-gradient(transparent 0,transparent 31px,#efe6c8 31px,#efe6c8 32px);background-attachment:local;line-height:32px;padding-top:0}
.mrow #lsDate{min-width:0;width:0}

/* one shape for «back» everywhere: a pill */
.bar #back,.card h2 #back,.tkbar #back,.pill{border:1px solid var(--line);border-radius:999px;padding:6px 14px;background:#fff;color:var(--brand2);font-size:13px;font-weight:600;cursor:pointer;min-height:36px}

</div></header>

</div></footer>
<div class="loading" id="loading">جارٍ التحميل…</div>
<script>
var S = {boot:null, teacher:'', pin:'', month:'', sup:false, view:'login', home:null,
         cls:'', data:null, tab:'grades', subject:'', si:0, quick:0, group:0, item:0,
         acad:{}, edu:{}, det:{}, orig:{acad:{}, edu:{}, det:{}}, open:{}, dirty:false,
         vinit:null, v:null, vItem:0, homes:{}, classes:{}, att:null, tk:null, tg:null, asSup:false, finit:null, f:null, li:null, lf:null, ls:null, lDay:'', parent:'', pl:null, plErr:'', pSub:'', pY:0, pNew:null};
var app = document.getElementById('app');
var NOTES = [{key:'أبرز ما تحسّن', label:'أبرز ما تحسّن'}, {key:'ما يحتاج متابعة', label:'ما يحتاج متابعة'}];
var LEAVE = 'لديك تغييرات غير محفوظة. هل تريد المتابعة دون حفظ؟';

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
var busy=0;
function load(on){ busy=Math.max(0,busy+(on?1:-1)); document.getElementById('loading').classList.toggle('on',busy>0); }
var API_URL='https://script.google.com/macros/s/AKfycbwVRJuchV8FGt_BRcCIJjmh4TwzE74CHZ-OYwH9Bml-yEMfEaJbPqxMDDNOygqTuF3BeA/exec';
var IS_APP='yes'==='yes';  // true only in the installable app on GitHub Pages
function call(fn,args,ok,onFail,quiet){
  var shown=!quiet; if(shown) load(true);
  function done(){ if(shown){ shown=false; load(false); } }
  function fail(m){ done(); if(onFail){ onFail(m); return; } status('err', m || 'حدث خطأ، حاول مرة أخرى'); }
  function viaScriptRun(){
    if(!(window.google && google.script && google.script.run)){ fail('تعذّر الاتصال بالخادم. تأكد من الإنترنت ثم أعد المحاولة.'); return; }
    var r = google.script.run.withSuccessHandler(function(x){done();ok(x);})
      .withFailureHandler(function(e){ fail(e && e.message); });
    r[fn].apply(r,args);
  }
  if(API_URL.indexOf('https://')!==0 || !window.fetch){ viaScriptRun(); return; }
  var ctl=window.AbortController? new AbortController() : null, timer=setTimeout(function(){ if(ctl) ctl.abort(); }, 60000);
  fetch(API_URL,{method:'POST',credentials:'omit',redirect:'follow',keepalive:(fn==='webPunch'),headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args}),signal:ctl?ctl.signal:undefined})
    .then(function(r){ if(!r.ok) throw new Error('http'); return r.json(); })
    .then(function(res){
      clearTimeout(timer);
      if(res && res.ok){ done(); setTimeout(function(){ ok(res.v); },0); } else fail(res && res.err);
    }, function(e){
      clearTimeout(timer);
      if(e && e.name==='AbortError'){ fail('انتهت مهلة الاتصال. تحقّق من الإنترنت ثم أعد المحاولة؛ إن كنت حفظت، افتح الصفحة من جديد لترى هل وصل الحفظ.'); return; }
      if(!IS_APP && window.google && google.script && google.script.run) viaScriptRun(); else fail('تعذّر الاتصال بالخادم. تأكد من الإنترنت ثم أعد المحاولة.');
    });
}
/** May the page reload itself now for a new version? Only where nothing typed can be lost. */
function appIdle(){ var a=document.activeElement, typing=a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName); return !S.dirty && !busy && !punch.on && !typing && ['home','login','welcome','ppick','parent','pmdone'].indexOf(S.view)>=0; }
function store(k,v){try{ if(v===undefined) return localStorage.getItem(k); if(v===null) localStorage.removeItem(k); else localStorage.setItem(k,v);}catch(e){return null;}}
function forget(){ store('albaraem_pin',null); store('albaraem_home',null); S.pin=''; S.homes={}; S.classes={}; S.home=null; S.att=null; S.attAt=0; S.attBusy=false; S.vinit=null; S.v=null; S.tk=null; S.tg=null; S.mi=null; S.mt=null; S.li=null; S.lf=null; S.ls=null; S.pm=null; S.pmo=null; S.dirty=false; }
function jget(k){ try{ return JSON.parse(store(k)||'null'); }catch(e){ return null; } }
function jput(k,v){ try{ store(k,JSON.stringify(v)); }catch(e){} }
function thisMonth(months,fallback){ var d=new Date(), m=(d.getMonth()+1)+'/'+d.getFullYear(); return months.indexOf(m)>=0 ? m : (fallback && months.indexOf(fallback)>=0 ? fallback : months[0]); }
function hkey(){ return S.teacher+'|'+S.month; }
function status(kind,msg){var st=document.getElementById('st'); st.className='st '+(kind||''); st.textContent=msg; if(kind==='err') document.getElementById('savebar').style.display='block';}
function setDirty(d){S.dirty=d; document.getElementById('saveBtn').disabled=!d; status(d?'dirty':'', d?'تغييرات غير محفوظة':'لا توجد تغييرات');}
function leave(fn){ if(S.dirty && !confirm(LEAVE)) return; setDirty(false); fn(); }
function clone(o){return JSON.parse(JSON.stringify(o||{}));}
function keep(fn){var y=window.scrollY; fn(); window.scrollTo(0,y);}
window.addEventListener('beforeunload',function(e){ if(S.dirty){e.preventDefault(); e.returnValue='';} });

// ---------------------------------------------------------------- login
function start(){
  function cantLoad(){ load(false); app.innerHTML='<div class="card"><h2>تعذّر تحميل الصفحة</h2><div class="hint" style="margin-top:0">تأكد من اتصال الإنترنت ثم أعد المحاولة.'+(IS_APP?'':' إذا كنت مسجّلًا بأكثر من حساب Google في هذا المتصفح، افتح الرابط في نافذة خاصة (Incognito) أو من الجوال.')+'</div><button class="btn block" onclick="location.reload()">إعادة المحاولة</button></div>'; }
  setTimeout(function(){ if(!S.boot && !S.home && !S.parent) cantLoad(); }, 15000);
  var cached=jget('albaraem_boot'), savedPin=store('albaraem_pin');
  // a parent: the class link, or the class this phone opened last (a signed-in teacher's phone stays the teacher's)
  var pid=parentId() || (savedPin===null ? (store('albaraem_parent')||'') : '');
  if(pid){ if(cached) S.boot=cached; openParent(pid); return; }
  S.teacher=store('albaraem_teacher')||'';
  function known(b){ return b && b.teachers.some(function(x){return x.name===S.teacher;}); }
  function gotBoot(b){ S.boot=b; jput('albaraem_boot',b); }
  if(S.teacher && savedPin!==null && known(cached)){
    // remembered login: show the last home page at once, then refresh boot + home together (one round trip)
    S.boot=cached; S.pin=savedPin; S.month=thisMonth(cached.months,cached.currentMonth);
    var last=jget('albaraem_home');
    if(last && last.key===hkey()){ S.homes[hkey()]=last.h; S.home=last.h; S.sup=!!last.h.supervisor; S.homeBusy=(S.homeBusy||0)+1; renderHome(); S.homeBusy--; }
    call('webBootstrap',[],gotBoot,function(){},true);
    homeFetch(!S.home, function(m){
      if(/غير صحيح|غير موجود|لا يوجد رمز/.test(m||'')){ forget(); renderLogin(); return; }
      if(S.home) return;   // keep showing the cached page
      app.innerHTML='<div class="card"><h2>تعذّر الاتصال</h2><div class="hint" style="margin-top:0">'+esc(m||'تأكد من اتصال الإنترنت ثم أعد المحاولة.')+'</div><button class="btn block" onclick="location.reload()">إعادة المحاولة</button></div>';
    });
    return;
  }
  if(cached){ S.boot=cached; S.month=thisMonth(cached.months,cached.currentMonth); renderEntry(); call('webBootstrap',[],function(b){ gotBoot(b); var ch=JSON.stringify(b.teachers)!==JSON.stringify(cached.teachers) || !!b.parents!==!!cached.parents; if(ch && S.view==='login') renderLogin(); else if(ch && S.view==='welcome') renderEntry(); },function(){},true); return; }
  call('webBootstrap',[],function(b){ gotBoot(b); S.month=thisMonth(b.months,b.currentMonth); renderEntry(); }, cantLoad);
}
function renderLogin(){
  S.view='login'; S.parent=''; ttlSub('');
  document.getElementById('savebar').style.display='none';
  document.getElementById('who').innerHTML='';
  var b=S.boot, t=b.teachers, opts='<option value="">— اختر اسمك —</option>';
  t.forEach(function(x){opts+='<option value="'+esc(x.name)+'"'+(x.name===S.teacher?' selected':'')+'>'+esc(x.name)+'</option>';});
  var mo=''; b.months.forEach(function(m){mo+='<option value="'+esc(m)+'"'+(m===S.month?' selected':'')+'>'+esc(m)+'</option>';});
  app.innerHTML='<div class="ptitle"><b>دخول المعلمين</b><span>اختر اسمك واكتب رمزك.</span></div><div class="card">'+
    '<label class="f">الاسم</label><select id="tSel">'+opts+'</select>'+
    '<div id="pinBox"></div>'+
    '<label class="f">الشهر</label><select id="mSel">'+mo+'</select>'+
    '<button class="btn block" id="go">دخول</button>'+
    '<div class="hint">رمز الدخول أربعة أرقام تأخذه من الإدارة. يتذكّر هذا الجهاز دخولك، فلا تحتاج لكتابته مرة أخرى حتى تضغط «خروج».</div></div>'+
    (b.parents && b.parents.length ? '<button class="pback" id="lBack">› رجوع</button>' : '');
  var lb=document.getElementById('lBack'); if(lb) lb.onclick=function(){ renderWelcome(); };
  var tSel=document.getElementById('tSel');
  function pinUi(){
    var x=t.filter(function(y){return y.name===tSel.value;})[0];
    document.getElementById('pinBox').innerHTML = x ? '<label class="f">رمز الدخول</label><input type="password" id="pin" inputmode="numeric" maxlength="8" autocomplete="off">' : '';
  }
  tSel.onchange=pinUi; pinUi();
  document.getElementById('go').onclick=function(){
    if(!tSel.value){tSel.focus();return;}
    S.teacher=tSel.value; S.month=document.getElementById('mSel').value;
    var p=document.getElementById('pin'); S.pin=p?p.value.trim():'';
    call('webHome',[S.teacher,S.pin,S.month],function(h){ store('albaraem_teacher',S.teacher); store('albaraem_pin',S.pin); gotHome(h); renderHome(); });
  };
}
// phone back button: inside a page it goes to the home page (asking first if something is unsaved) instead of closing the app
var navOn=false;
window.addEventListener('popstate',function(){
  navOn=false;
  if(S.view==='psub'||S.view==='pmdone'){ renderParent(); return; }
  if(S.view==='pmform'){ if(S.pmDirty && String(S.pmf.text||'').trim() && !confirm('لم تُرسل رسالتك بعد. هل تريد تركها؟')){ try{ history.pushState({albaraem:'psub'},''); }catch(e){} return; } S.pmDirty=false; renderParent(); return; }
  if(S.view==='pmone'){ if(S.dirty && !confirm(LEAVE)){ navMark(); return; } setDirty(false); renderPmBox(); return; }
  if(S.view==='lesson'){ if(S.dirty && !confirm(LEAVE)){ navMark(); return; } setDirty(false); lesBack(); return; }
  if(S.view==='home'||S.view==='login'||S.view==='parent'||S.view==='ppick'||S.view==='welcome') return;
  if(S.dirty && !confirm(LEAVE)){ navMark(); return; }
  setDirty(false); goHome();
});
function navMark(){ if(navOn||S.view==='home'||S.view==='login') return; try{ history.pushState({albaraem:1},''); navOn=true; }catch(e){} }
function who(){
  navMark();
  document.getElementById('who').innerHTML=esc(S.teacher)+' · '+esc(S.month)+'<br>'+
    (S.view!=='home'?'<a id="homeL">الرئيسية</a>':'')+'<a id="out">خروج</a>';
  var h=document.getElementById('homeL'); if(h) h.onclick=function(){ leave(goHome); };
  document.getElementById('out').onclick=function(){ leave(function(){ S.cls=''; forget(); renderEntry(); }); };
}

// ---------------------------------------------------------------- home: my evaluations + visits
function gotHome(h,seq){
  if(h && h.adm && h.adm.err){ var prev=S.home||S.homes[hkey()]||(jget('albaraem_home')||{}).h; h.adm=(prev && prev.adm && !prev.adm.err)? prev.adm : {}; }
  // the card that came with the home page is used only if no punch or save started after the request left
  if(h && h.att){ if(!punch.on && (seq===undefined || seq===(S.attSeq||0))){ S.att=h.att; S.attAt=Date.now(); } delete h.att; }   // not kept with the cached home: it is today's only
  S.home=h; S.sup=!!h.supervisor; S.homes[hkey()]=h; jput('albaraem_home',{key:hkey(),h:h}); }
function homeFetch(loud,onFail,force){
  var k=hkey(), v0=S.view, seq=S.attSeq||0; S.homeBusy=(S.homeBusy||0)+1;
  call('webHome',[S.teacher,S.pin,S.month],function(h){
    S.homeBusy=Math.max(0,S.homeBusy-1);
    if(!S.pin || hkey()!==k) return;                         // signed out, or another teacher / month chosen meanwhile
    var att0=JSON.stringify(S.att), hadAtt=!!(h&&h.att), old=JSON.stringify(S.homes[k]);
    gotHome(h,seq);
    var changed=JSON.stringify(h)!==old || (hadAtt && JSON.stringify(S.att)!==att0);
    // redraw only while the teacher is looking at the home page (or asked for it) — never over a class or a visit opened meanwhile
    if(S.view==='login' || (force && S.view===v0) || (S.view==='home' && changed)) renderHome(); else attMaybe();
    if(!homeFetch.warm && h && h.les && h.les.on){ homeFetch.warm=true; setTimeout(function(){ if(S.pin && !S.li && S.view==='home') lesRefresh(); },1500); }   // «دروس اليوم» opens at once
  }, function(m){ S.homeBusy=Math.max(0,S.homeBusy-1); attMaybe(); if(onFail) onFail(m); else status('err', m || 'حدث خطأ، حاول مرة أخرى'); }, !loud);
}
/** The attendance card alone — only when it did not come with the home page (older server, or the home request failed). */
function attMaybe(){
  var a=S.home&&S.home.adm;
  if(S.view==='home' && a && a.att && a.started && !S.attBusy && !S.homeBusy && !punch.on && (!S.att || Date.now()-(S.attAt||0)>60000)) attFetch();
}
function goHome(){
  var c=S.homes[hkey()];
  if(c){ S.home=c; S.sup=!!c.supervisor; S.homeBusy=(S.homeBusy||0)+1; renderHome(); S.homeBusy--; homeFetch(false,function(){}); }   // the attendance card comes with this request: no second one
  else homeFetch(true,undefined,true);
}
/** From the home answer (new server): class sizes, this teacher's classes and subjects, ready phrases for notes. */
function evInfo(){ return (S.home && S.home.ev) || null; }
function evSize(c){ var e=evInfo(); return e && e.size ? (e.size[c]||0) : 0; }
function evMine(){ var e=evInfo(); return (e && e.mine) || {}; }
function evMySubjects(c){ return evMine()[c] || []; }
/** The class's subjects with this teacher's own first. */
function evOrder(list){ var m=evMySubjects(S.cls); return list.filter(function(s){ return m.indexOf(s)>=0; }).concat(list.filter(function(s){ return m.indexOf(s)<0; })); }
/** Ready phrases under the note box being typed in (evaluation page). A tap adds the phrase; the keyboard stays. */
document.addEventListener('focusin',function(e){
  var t=e.target; if(S.view!=='class' || !t || t.tagName!=='TEXTAREA' || !t.hasAttribute('data-n')) return;
  var e2=evInfo(), P=e2 && e2.phrases; if(!P) return;
  var list=/إناث/.test(S.cls||'')? P.f : P.m; if(!list || !list.length) return;
  var host=(t.parentElement && t.parentElement.classList.contains('noteRow'))? t.parentElement : t;   // below the note box, full width
  var old=app.querySelector('.phr'); if(old && old.previousElementSibling===host) return; if(old) old.remove();
  var d=document.createElement('div'); d.className='phr'; d.setAttribute('aria-label','عبارات جاهزة');
  d.innerHTML=list.map(function(x,i){ return '<button type="button" data-ph="'+i+'">'+esc(x)+'</button>'; }).join('');
  host.insertAdjacentElement('afterend',d);
  d.addEventListener('pointerdown',function(ev){ ev.preventDefault(); });          // keep the box focused
  d.querySelectorAll('[data-ph]').forEach(function(b){ b.onclick=function(){ var x=list[+b.getAttribute('data-ph')], v=t.value.trim();
    t.value = v ? v.replace(/[.،]?$/,'.')+' '+x : x; t.dispatchEvent(new Event('input',{bubbles:true})); t.focus(); }; });
});
function renderHome(){
  S.view='home'; S.asSup=false; who(); setTimeout(prefetchClasses, 600); setTimeout(obFlush, 300);
  document.getElementById('savebar').style.display='none';
  var h=S.home, done={}, html='<div class="greet"><b>أهلًا '+esc(S.teacher)+'</b><span>'+esc(lLabel(localIso()))+'</span></div>'+installCard()+attCard()+pmHomeCard()+lesHomeCard()+rolesCard()+'<div class="card"><h2>تقييماتي الشهرية</h2>'+
    '<div class="mrow"><span>الشهر</span><select id="hMonth">'+S.boot.months.map(function(m){return '<option value="'+esc(m)+'"'+(m===S.month?' selected':'')+'>'+esc(m)+'</option>';}).join('')+'</select></div>';
  if(h.classes.length){
    html+='<div class="list">';
    h.classes.forEach(function(c){
      done[c.cls]=true;
      var parts=[]; if(c.parts[0]) parts.push('علامات/سلوك'); if(c.parts[2]) parts.push('مهارات/ملاحظات'); if(c.parts[1]) parts.push('تربوي');
      var N=evSize(c.cls), full=N && c.n>=N;
      html+='<div class="row'+(full?' done':'')+'"><div class="nm"><b>'+esc(c.cls)+'</b><small>'+(N?'قيّمت '+c.n+' من '+N+(full?' ✓':''):c.n+' طالبًا')+' · '+esc(parts.join('، '))+'</small>'+(N?'<span class="evbar"><i style="width:'+Math.min(100,Math.round(100*c.n/N))+'%"></i></span>':'')+'</div>'+
        '<button class="btn ghost sm" data-open="'+esc(c.cls)+'">تعديل</button></div>';
    });
    html+='</div><div class="hint">«تعديل» يفتح تقييمك السابق معبّأً كما حفظته؛ عدّل ثم اضغط «حفظ»، فيتحدّث سجلك نفسه في الملف ولا يُضاف ردّ جديد.</div>';
  } else html+='<div class="hint" style="margin-top:0">لم تحفظ أي تقييم لهذا الشهر بعد.</div>';
  var my=evMine(), mc=S.boot.classes.filter(function(c){ return my[c]; }), oc=S.boot.classes.filter(function(c){ return !my[c]; });
  var chip=function(c){ return '<button class="chip'+(done[c]?' done':'')+'" data-open="'+esc(c)+'">'+esc(c)+(done[c]?' ✓':'')+'</button>'; };
  if(mc.length) html+='<div class="sub"><div class="lbl">صفوفك في جدول الحصص</div><div class="chips">'+mc.map(chip).join('')+'</div></div>';
  html+='<div class="sub"><div class="lbl">'+(mc.length?'صفوف أخرى':'اختر صفًا للتقييم')+'</div><div class="chips">'+oc.map(chip).join('')+'</div></div></div>';
  if(S.sup){
    html+='<div class="card"><h2>زيارات الحصص<span class="grow"></span><button class="btn sm" id="newV">＋ زيارة جديدة</button></h2>';
    if(h.visits&&h.visits.length){
      html+='<div class="list">';
      h.visits.forEach(function(v){
        html+='<div class="row"><div class="nm"><b>'+esc(v.cls)+' · '+esc(v.subject)+'</b><small>'+esc(v.date)+' · '+esc(v.teacher)+(v.lesson?' · '+esc(v.lesson):'')+'</small></div>'+
          (v.index!==''&&v.index!=null?'<span class="badge">'+esc(v.index)+'</span>':'')+
          '<button class="btn ghost sm" data-visit="'+esc(v.id)+'">تعديل</button></div>';
      });
      html+='</div>';
    } else html+='<div class="hint" style="margin-top:0">لا توجد زيارات مسجّلة باسمك بعد.</div>';
    html+='<div class="hint">بعد كل حصة تحضرها: قيّم أداء المعلم/ة، ثم قيّم الطلاب سريعًا. تقييمات زياراتك تظهر في بطاقة الطالب ضمن قسم المشرفين.</div></div>';
  }
  if(S.sup && h.supClasses){   // a server older than V10 does not send these: the cards stay hidden
    var sd={}; h.supClasses.forEach(function(x){ sd[x.cls]=x.n; });
    html+='<div class="card"><h2>تقييمي التربوي الشهري (مشرف)</h2><div class="hint" style="margin-top:0">تقييمك للطلاب باسمك، بلا مادة. يظهر في بطاقة الطالب منفصلًا عن المعلمين.</div><div class="chips">';
    S.boot.classes.forEach(function(c){ html+='<button class="chip'+(sd[c]?' done':'')+'" data-sopen="'+esc(c)+'">'+esc(c)+(sd[c]?' ✓ '+sd[c]:'')+'</button>'; });
    html+='</div></div>';
  }
  if(S.sup && h.fams){
    html+='<div class="card"><h2>مقابلات الأهالي<span class="grow"></span><button class="btn sm" id="newF">＋ مقابلة جديدة</button></h2>';
    if(h.fams.length){

    if(S.classes[k+'|'+c]){ next(); return; }

  })();
}

// skills table markers: «سلوك: …» rated with the class behaviour, «نص: …» free text, «تقدير: …» four levels, «بلا علامة» no grade

function kindOf(x){ x=String(x); if(x==='بلا علامة') return 'nograde'; if(x.indexOf('سلوك:')===0) return 'beh'; if(x.indexOf('نص:')===0) return 'text'; if(x.indexOf('تقدير:')===0) return 'rate4'; return 'rate'; }

function val(sheet,name,key){ var o=S[sheet][name]; return o && o[key]!==undefined && o[key]!==null ? o[key] : ''; }
function put(sheet,name,key,v){ if(!S[sheet][name]) S[sheet][name]={}; S[sheet][name][key]=v; setDirty(true); }

  app.querySelectorAll('[data-si]').forEach(function(b){b.onclick=function(){S.si=+b.getAttribute('data-si'); keep(render);};});

      inp.classList.toggle('bad',bad);

  var df=app.querySelector('[data-dfill]');
  if(df) df.onclick=function(){ var it=items[S.si];

    keep(render);

function diff(sheet){
  var out={}, cur=S[sheet], org=S.orig[sheet];
  Object.keys(cur).forEach(function(name){
    var o=cur[name], b=org[name]||{}, ch={}, any=false;
    Object.keys(o).forEach(function(k){ var a=o[k]===undefined||o[k]===null?'':o[k], bb=b[k]===undefined||b[k]===null?'':b[k]; if(String(a)!==String(bb)){ch[k]=a; any=true;} });
    if(any) out[name]=ch;
  });
  return out;
}
function diffDet(){
  var out={};
  Object.keys(S.det).forEach(function(name){
    var o=S.det[name], b=S.orig.det[name]||{}, ch={}, any=false;
    Object.keys(o).forEach(function(k){
      var a=o[k]||{}, bb=b[k]||{}, c={}, has=false;
      ['lvl','note'].forEach(function(f){ var x=a[f]==null?'':a[f], y=bb[f]==null?'':bb[f]; if(String(x)!==String(y)){c[f]=x; has=true;} });
      if(has){ch[k]=c; any=true;}
    });
    if(any) out[name]=ch;
  });
  return out;
}
/* Instant save: the change is kept on the phone first (outbox) and sent in the background, in order, with retries.
   The teacher never waits for the server; a save that has not arrived yet is shown in a strip and resent automatically. */
var obDone={};   // when a save last reached the file, per teacher|month|class (a class load older than that is thrown away)
function obGet(){ return jget('albaraem_outbox')||[]; }
function obSet(a){ jput('albaraem_outbox',a); obStrip(); }
function obCount(){ return obGet().length; }
function obStrip(){

/** A grade out of 100 that was entered or changed needs a note (why this grade). Returns the first student missing one. */
/** From 11/2026 a grade out of 100 is required for every student in each subject the teacher rated this month

var GRADE_REQ_FROM='11/2026';
function missingGrades(){
  var d=S.data, ms=(S.boot&&S.boot.months)||[];
  if(S.asSup || ms.indexOf(S.month)<0 || ms.indexOf(S.month)<ms.indexOf(GRADE_REQ_FROM)) return null;

  d.subjects.some(function(sub){
    if(skillList(sub).indexOf('بلا علامة')>=0) return false;
    var touched=d.students.some(function(st){
      if(val('acad',st.name,sub)!=='') return true;
      var o=S.det[st.name]||{}; return Object.keys(o).some(function(k){ return k.indexOf(sub+'||')===0 && ((o[k].lvl!==''&&o[k].lvl!=null)||String(o[k].note||'').trim()!==''); });
    });
    if(!touched) return false;
    var miss=d.students.filter(function(st){ return val('acad',st.name,sub)===''; });
    if(miss.length){ out={sub:sub, st:miss[0], n:miss.length}; return true; }
    return false;

}
function missingGradeNote(){

// ---------------------------------------------------------------- «دروس اليوم»: teachers post, supervisors follow up, parents read
var LDAYS=['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
function lDate(iso){ var m=String(iso||'').split('-'); return new Date(+m[0],+m[1]-1,+m[2],12); }
function lIso(d){ var p=function(n){return (n<10?'0':'')+n;}; return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
function lDayName(iso){ return LDAYS[lDate(iso).getDay()]; }
function lLabel(iso){ var m=String(iso).split('-'); return lDayName(iso)+' '+(+m[2])+'/'+(+m[1]); }
function lAdd(iso,n){ var d=lDate(iso); d.setDate(d.getDate()+n); return lIso(d); }
function lBase(c){ var I=S.li; return I && c.indexOf(I.kg+' - ')===0 ? I.kg : c; }
function lOverlap(a,b){ if(a===b) return true; var I=S.li; if(!I) return false; return (a===I.kg && lBase(b)===I.kg) || (b===I.kg && lBase(a)===I.kg); }
function lNl(s){ return esc(s).replace(/\n/g,'<br>'); }

/* Lessons outbox: a save or a delete is kept on the phone first and sent in order; the id is made here, so a repeated send never doubles a lesson. */
function lobGet(){ return jget('albaraem_les_outbox')||[]; }
function lobSet(a){ var s=JSON.stringify(a); store('albaraem_les_outbox',s); return store('albaraem_les_outbox')===s; }   // true only when the phone really kept it
function lobMine(){ return lobGet().filter(function(x){ return x.who===S.teacher; }); }
function lobFlush(force){
  if(lobFlush.on || !S.pin) return;
  var a=lobGet(), k=-1;
  for(var i=0;i<a.length;i++){ if(a[i].who===S.teacher && (force || !a[i].err)){ k=i; break; } }
  if(k<0) return;
  var x=a[k]; lobFlush.on=true;
  function done(err,net){
    lobFlush.on=false;
    var b=lobGet(), j=-1; b.forEach(function(y,q){ if(y.k===x.k) j=q; });
    if(j>=0){ if(!err) b.splice(j,1); else if(net){ b[j].n=(b[j].n||0)+1; delete b[j].err; } else b[j].err=err; }
    lobSet(b);
    if(!err && S.li && S.li.mine){                           // the server has it: it joins the list in hand, so the row never blinks out while the list is fetched again
      var m=S.li.mine, q=-1; m.forEach(function(y,z){ if(y.id===x.id) q=z; });
      if(x.op==='del'){ if(q>=0) m.splice(q,1); }
      else if(!x.p.owner){ var o={id:x.id,date:x.p.date,cls:x.p.cls,subject:x.p.subject,p:+x.p.period,title:x.p.title,text:x.p.text,hw:x.p.hw,teacher:S.teacher,edit:true}; if(q>=0){ o.hidden=m[q].hidden; o.by=m[q].by; m[q]=o; } else m.push(o); }
      if(x.op!=='del') lobFlush.just=x.id;
    }
    if(S.view==='lessons') renderLessons(true);
    lobFlush.just='';
    if(!err){ if(lobMine().some(function(y){return !y.err;})) setTimeout(function(){ lobFlush(); },50); else lesRefresh(); }
    else if(net) setTimeout(function(){ lobFlush(); }, Math.min(60000, 4000*Math.pow(2,Math.min(4,(j>=0&&b[j].n)||1))));
    else setTimeout(function(){ lobFlush(); },50);   // go on with the next one; this one waits for the teacher
  }
  function fail(m){ done(m||'خطأ', !m || /تعذّر الاتصال|انتهت مهلة/.test(m)); }
  if(x.op==='del') call('webLessonDelete',[S.teacher,S.pin,x.id],function(){ done(''); },fail,true);
  else { var p=clone(x.p); p.name=S.teacher; p.pin=S.pin; call('webLessonSave',[p],function(){ done(''); },fail,true); }
}
window.addEventListener('online',function(){ lobFlush(true); });
/** The server's list with this phone's waiting saves and deletes applied on top. */
function lesMine(){
  var I=S.li, list=(I.mine||[]).map(function(x){ return clone(x); });
  lobMine().forEach(function(x){
    var j=-1; list.forEach(function(y,q){ if(y.id===x.id) j=q; });
    if(x.op==='del'){ if(j>=0) list.splice(j,1); return; }
    var o={id:x.id,date:x.p.date,cls:x.p.cls,subject:x.p.subject,p:+x.p.period,title:x.p.title,text:x.p.text,hw:x.p.hw,teacher:x.p.owner||S.teacher,edit:true,wait:true,err:x.err||''};
    if(j>=0){ o.hidden=list[j].hidden; o.by=list[j].by; list[j]=o; } else if(!x.p.owner) list.push(o);
  });
  list.sort(function(a,b){ return a.date<b.date?1:a.date>b.date?-1:a.p-b.p; });
  return list;
}
function lesDays(){
  // this week, Sunday → today (school days of the timetable, and today)
  var I=S.li, t=localIso(), d=lDate(t), out=[], w=d.getDay();
  for(var k=w;k>=0;k--){ var iso=lAdd(t,-k), nm=lDayName(iso); if((I.schoolDays||[]).indexOf(nm)>=0 || k===0) out.push(iso); }
  return out;
}
/** Required periods of that day still without a lesson (by this teacher or a team-mate). */
function lesLeft(day, mine){
  var I=S.li, dn=lDayName(day);
  return (I.slots||[]).filter(function(s){ return s.day===dn && s.req && !mine.some(function(x){ return x.date===day && x.p===s.p && lOverlap(x.cls,s.cls); })
    && !(I.done||[]).some(function(x){ return x.date===day && x.p===s.p && lOverlap(x.cls,s.cls); }); }).length;
}
function lesCanEdit(){ return true; }   // the whole week, Friday and Saturday included; the server refuses older weeks
function lesRefresh(){
  if(!S.pin) return; var who0=S.teacher; lesRefresh.at=Date.now();
  call('webLessonsInit',[S.teacher,S.pin],function(I){ if(S.teacher!==who0) return; S.li=I; jput('albaraem_les',{who:who0,I:I}); if(S.view==='lessons') renderLessons(true); },function(){},true);
}
function openLessons(day){
  var c=jget('albaraem_les');
  S.lDay=typeof day==='string'? day : '';   // chosen in renderLessons: today, or on Friday / Saturday the last school day
  if(c && c.who===S.teacher && c.I){ S.li=c.I; renderLessons(); lesRefresh(); lobFlush(); return; }
  call('webLessonsInit',[S.teacher,S.pin],function(I){ S.li=I; jput('albaraem_les',{who:S.teacher,I:I}); renderLessons(); lobFlush(); });
}

/** One colour per subject everywhere (teacher's list and form, parents' notebooks). */
function lesColor(s){
  s=String(s||'');
  var M=[[/عربية|وجدانية/,0],[/حساب|سيرة|رياضة/,1],[/علوم|قصص|فن/,2],[/خط|فقه/,3],[/تلقين|آداب/,4],[/إنجليزية|تفسير/,5],[/عقيدة/,6],[/حديث|صحابيات|حياتية/,7]];
  for(var k=0;k<M.length;k++) if(M[k][0].test(s)) return M[k][1];
  var n=0; for(var i=0;i<s.length;i++) n=(n*31+s.charCodeAt(i))%1009; return n%8;
}
function renderLessons(keepScroll){

  S.view='lessons'; who(); document.getElementById('savebar').style.display='none';
  var I=S.li, days=lesDays(), today=localIso(), mine=lesMine(), can=lesCanEdit();
  if(days.indexOf(S.lDay)<0){ S.lDay=today; if((I.schoolDays||[]).indexOf(lDayName(today))<0 && days.length>1) S.lDay=days[days.length-2]; }
  var dn=lDayName(S.lDay), slots=(I.slots||[]).filter(function(s){ return s.day===dn; });
  var st=slots.map(function(s){
    var m=mine.filter(function(x){ return x.date===S.lDay && x.p===s.p && lOverlap(x.cls,s.cls); })[0];
    var o=!m && (I.done||[]).filter(function(x){ return x.date===S.lDay && x.p===s.p && lOverlap(x.cls,s.cls); })[0];
    return {s:s,m:m,o:o}; });
  var need=st.filter(function(x){ return x.s.req || x.m || x.o; }).length, got=st.filter(function(x){ return x.m || x.o; }).length;

  var pc=need?Math.round(100*got/need):0, pk=S.teacher+'|'+S.lDay, pv=renderLessons.pv||{};

  if(st.length){ h+='<div class="lslots">';
    st.forEach(function(x,i){ var s=x.s, m=x.m, o=x.o;
      h+='<div class="row c'+lesColor(s.subject)+(m||o?' done':'')+'"><span class="pb"><small>الحصة</small>'+s.p+'</span><div class="nm"><b>'+esc(s.cls)+'</b><small>'+esc(s.subject)+(s.req?'':' · اختياري')+(o?' · نزّلها '+esc(o.teacher):'')+'</small>'+
        (m?'<q>'+esc(m.title)+'</q>':'')+(m&&m.hidden?'<i>مخفي عن الأهل</i>':'')+(m&&m.err?'<i>⚠️ لم يُقبل: '+esc(m.err)+'</i>':m&&m.wait?'<i class="none">⏳ بانتظار الإنترنت</i>':'')+'</div>';
      if(m) h+='<span class="dn'+(m.wait&&!m.err?' w':m.id===lobFlush.just?' just':'')+'">✓</span>'+(m.edit?'<button class="btn ghost sm" data-ledit="'+esc(m.id)+'">تعديل</button>':'');
      else if(o) h+='<span class="dn">✓</span>';
      else if(can) h+='<button class="btn sm" data-lslot="'+i+'">اكتب الدرس</button>';
      h+='</div>'; });
    h+='</div>'; }
  else h+='<div class="lnone">لا حصص لك في جدول هذا اليوم.</div>';

  h+='<div class="hint" style="text-align:center">يظهر الدرس للأهل فور الحفظ، دون اسمك ودون أي اسم طالب. يُنزَّل ويُعدَّل ويُحذف حتى نهاية السبت من الأسبوع نفسه.</div>';

  app.innerHTML=h;
  var n=document.getElementById('lNew'); if(n) n.onclick=function(){ lesForm({date:S.lDay}); };

  app.querySelectorAll('[data-lslot]').forEach(function(b){ b.onclick=function(){ var s=slots[+b.getAttribute('data-lslot')]; lesForm({date:S.lDay,cls:s.cls,subject:s.subject.split('/')[0].trim(),period:s.p}); }; });
  app.querySelectorAll('[data-ledit]').forEach(function(b){ b.onclick=function(){ var id=b.getAttribute('data-ledit'), x=mine.filter(function(y){return y.id===id;})[0]; if(x) lesForm({id:x.id,date:x.date,cls:x.cls,subject:x.subject,period:x.p,title:x.title,text:x.text,hw:x.hw}); }; });
  var sp=document.getElementById('lSup'); if(sp) sp.onclick=function(){ openLesSup(''); };

  if(S.view==='lessons' && S.pin && Date.now()-(lesRefresh.at||0)>60000) lesRefresh();
});

document.getElementById('saveBtn').onclick=function(){ if(busy>0) return; if(S.view==='lesson') saveLesson(); else if(S.view==='visit') saveVisit(); else if(S.view==='tasks') saveTasks(); else if(S.view==='tg') saveTg(); else if(S.view==='fam') saveFam(); else if(S.view==='meet') saveMeet(); else if(S.view==='pmone') savePm(); else saveClass(); };
start();
