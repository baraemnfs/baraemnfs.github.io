<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>مدرسة البراعم — صفحة المعلم</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f5e3b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="البراعم">
<meta name="robots" content="noindex,nofollow">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Aref+Ruqaa:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#17301f; --muted:#5e7065; --line:#dce5de; --bg:#f5f7f4; --card:#ffffff;
  --brand:#1f5e3b; --brand2:#24704a; --soft:#e6f0ea; --accent:#b8862b; --gold:#b8862b;
  --ok:#1e7b34; --warn:#c0392b;
  --r1:#f3b2b2; --r2:#f6cfa8; --r3:#fbe7a1; --r4:#cde8b5; --r5:#9bd3a5;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;font-size:15px;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 14px 110px}
header.top{background:var(--brand);color:#fff;padding:12px 16px 14px;padding-top:max(12px,env(safe-area-inset-top))}
header.top .logo{width:42px;height:42px;flex-shrink:0;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;border:2px solid var(--gold)}
header.top .logo svg{width:30px;height:30px;display:block}
header.top .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px}
header.top h1{font-family:'Aref Ruqaa',serif;font-size:24px;line-height:1.15;margin:0;font-weight:700}
header.top small{display:block;opacity:.8;font-size:12.5px;font-weight:400}
header.top .who{margin-inline-start:auto;text-align:left;font-size:13px;opacity:.95;line-height:1.7}
header.top .who a{color:#fff;opacity:.85;cursor:pointer;text-decoration:underline;margin-inline-start:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px}
.card h2{font-size:15px;margin:0 0 12px;color:var(--brand);display:flex;align-items:center;gap:8px}
.card h2 .grow{flex:1}
label.f{display:block;font-size:13px;color:var(--muted);margin:10px 0 6px}
select,input[type=password],input[type=text],input[type=date],.grid2 input[type=number]{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
.btn{border:0;border-radius:10px;padding:12px 16px;background:var(--brand2);color:#fff;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:#fff;color:var(--brand2);border:1px solid var(--brand2)}
.btn.sm{padding:7px 12px;font-size:13px}
.btn.danger{background:#fff;color:var(--warn);border:1px solid var(--warn)}
.btn.block{width:100%;margin-top:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;cursor:pointer;font-size:14px}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chip.done{border-color:#9cc77d}
.chip .n{font-size:11.5px;opacity:.75;margin-inline-start:4px}
.chips.small .chip{padding:6px 11px;font-size:13px}
.tabs{display:flex;background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px;margin-top:14px;position:sticky;top:0;z-index:5}
.tab{flex:1;border:0;background:transparent;padding:10px 6px;border-radius:9px;cursor:pointer;font-weight:600;color:var(--muted);font-size:14px}
.tab.on{background:var(--soft);color:var(--brand)}
.sub{margin-top:12px}
.sub .lbl{font-size:12.5px;color:var(--muted);margin-bottom:6px}
.bar{display:flex;align-items:center;gap:10px;margin:14px 2px 6px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.bar .grow{flex:1}
.bar .fill{border:1px dashed var(--brand2);color:var(--brand2);background:#fff;border-radius:8px;padding:5px 10px;cursor:pointer;font-size:12.5px}
.list{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:8px;padding:10px 12px;border-top:1px solid var(--line);flex-wrap:wrap}
.list > .row:first-child{border-top:0}
.row .nm{flex:1;min-width:0}
.row .nm b{display:block;font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm i{display:block;font-style:normal;font-size:12px;color:var(--warn);margin-top:2px}
.row .nm i.none{color:var(--muted)}
.row .nm small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.row.done{background:#fbfefb}
.sc{display:flex;gap:5px;flex-shrink:0}
.sc button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:600;padding:0}
.sc button.on[data-v="1"]{background:var(--r1);border-color:#e08f8f}
.sc button.on[data-v="2"]{background:var(--r2);border-color:#e0ad80}
.sc button.on[data-v="3"]{background:var(--r3);border-color:#dfc66a}
.sc button.on[data-v="4"]{background:var(--r4);border-color:#9cc77d}
.sc button.on[data-v="5"]{background:var(--r5);border-color:#6fb67c}
.grade{width:84px;flex-shrink:0;padding:9px 8px;border:1px solid var(--line);border-radius:9px;text-align:center;font-weight:600;background:#fff}
.grade.bad{border-color:var(--warn);background:#fdecea}
.nb{flex-shrink:0;border:1px solid var(--line);background:#fff;border-radius:9px;height:34px;padding:0 9px;cursor:pointer;font-size:12.5px;color:var(--muted)}
.nb.has{border-color:var(--accent);color:var(--accent);background:#fffaf0;font-weight:600}
.sc.four button{min-width:0;width:auto;flex:1;height:auto;min-height:44px;padding:4px 2px;font-size:12px;line-height:1.2;display:flex;flex-direction:column;align-items:center;justify-content:center}
.sc.four button small{font-size:11px;opacity:.65;margin-top:2px}
.row.wrap4{flex-wrap:wrap}
.row.wrap4 .nm{flex-basis:calc(100% - 50px)}
.row.wrap4 .sc.four{order:3;flex-basis:100%;margin-top:6px}
.obstrip{display:none;position:fixed;bottom:calc(84px + env(safe-area-inset-bottom,0px));inset-inline:10px;z-index:60;background:#fff8e1;border:1px solid #f0d27a;color:#6b5200;border-radius:12px;padding:8px 12px;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.08);cursor:pointer;text-align:center}
.obstrip.ok{background:#eaf6ec;border-color:#9fd1a8;color:#1d5b2a}
.obstrip.bad{background:#fdecec;border-color:#eba4a4;color:#8a1f1f}
textarea.need{border-color:#d9534f;box-shadow:0 0 0 3px rgba(217,83,79,.15)}
input.grade.need{border-color:#d9534f;box-shadow:0 0 0 3px rgba(217,83,79,.15)}
.noteRow{flex-basis:100%;display:flex}
.noteRow textarea,.row textarea.t{flex:1;min-height:40px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;resize:vertical;background:#fff}
.row textarea.t{flex:1.4}
.legend{font-size:12px;color:var(--muted);margin:8px 2px 0}
.empty{padding:26px;text-align:center;color:var(--muted)}
.banner{background:#fffaf0;border:1px solid #ecd9a8;color:#6b5414;border-radius:12px;padding:10px 12px;margin-top:12px;font-size:13px;line-height:1.7}
.badge{display:inline-block;background:var(--soft);color:var(--brand);border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600}
.trow{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.trow:first-child{border-top:0}
.trow .lab{flex:1;min-width:170px;font-size:14px}
.trow .lab .nb{height:26px;padding:0 7px;margin-inline-start:6px;vertical-align:middle;font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
footer.save{position:fixed;bottom:0;inset-inline:0;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));backdrop-filter:blur(6px);z-index:10}
footer.save .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px}
footer.save .st{flex:1;font-size:13px;color:var(--muted)}
footer.save .st.dirty{color:var(--accent);font-weight:600}
footer.save .st.ok{color:var(--ok);font-weight:600}
footer.save .st.err{color:var(--warn);font-weight:600}
.loading{position:fixed;inset:0;background:rgba(245,247,244,.7);display:none;align-items:center;justify-content:center;z-index:20;font-weight:600;color:var(--brand)}
.loading.on{display:flex}
.hint{font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.7}
.install{border-color:#e6d5ad;background:#fffbf2}
.att .big{display:flex;gap:10px;margin-top:12px}
.att .big .btn{flex:1;padding:14px 10px;font-size:16px}
.att .times{display:flex;gap:10px;margin-top:10px}
.att .times div{flex:1;background:var(--soft);border-radius:10px;padding:8px 10px;text-align:center}
.att .times b{display:block;font-size:20px;color:var(--brand)}
.att .times small{color:var(--muted);font-size:12px}
.att textarea,.why{width:100%;min-height:44px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;margin-top:6px;background:#fff}
.warn{color:var(--warn);font-weight:600}
.okc{color:var(--ok);font-weight:600}
.roles{display:flex;flex-wrap:wrap;gap:8px}
.tri{min-width:62px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 8px;cursor:pointer;font-size:12.5px;line-height:1.4}
.tri small{display:block;color:var(--muted);font-size:11px}
.tri.yes{background:var(--r5);border-color:#6fb67c}
.tri.no{background:var(--r1);border-color:#e08f8f}
.opts{display:flex;gap:4px;flex-wrap:wrap}
.opts button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 8px;font-size:12.5px;cursor:pointer}
.opts button.on.s0{background:var(--r5);border-color:#6fb67c}
.opts button.on.s1{background:var(--r3);border-color:#dfc66a}
.opts button.on.s2{background:var(--r1);border-color:#e08f8f}
.opts button.on.s3{background:#e5e9ea;border-color:#b9c3c5}
.tin{width:96px;padding:7px 6px;border:1px solid var(--line);border-radius:8px;background:#fff;text-align:center}
.dimrow{opacity:.6}
.row.mt .nm b{white-space:normal}
.mty{display:flex;gap:6px;flex-wrap:wrap}
.mty button{flex:1;min-width:120px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 8px;cursor:pointer;font-size:13.5px}
.mty button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.mstat{font-size:13.5px;line-height:1.9}
.install h2{color:var(--gold)}
.card{border-radius:16px}
.card h2{font-family:'Aref Ruqaa',serif;font-size:20px;line-height:1.4}
.card h2 button,.card h2 a,.card h2 .badge,.card h2 select{font-family:"IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;font-size:14px;line-height:1.5}
.greet{padding:22px 4px 0}
.greet b{display:block;font-family:'Aref Ruqaa',serif;font-size:29px;line-height:1.3;color:var(--brand)}
.greet span{display:block;color:var(--muted);font-size:14px}
.card.lhero{position:relative;background:var(--brand);border:0;color:#fff;border-radius:20px 8px 8px 20px;padding:18px 30px 18px 16px;overflow:hidden;box-shadow:0 12px 24px -14px rgba(23,48,31,.7)}
.card.lhero:before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:14px;background:#17472c}
.lh1 b{display:block;font-family:'Aref Ruqaa',serif;font-size:29px;line-height:1.3}
.lh1 span{display:block;font-size:13.5px;opacity:.88}
.ldots{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.ldots i{width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:700;font-size:14px}
.ldots i.d{background:#f2c230;border-color:#f2c230;color:#3a2a00}
.lhw{margin-top:10px;font-size:12.5px;background:rgba(255,255,255,.14);border-radius:10px;padding:6px 10px}
.lhb{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.lhb button{flex:1;border:0;border-radius:12px;padding:12px;background:#fff;color:var(--brand);font-weight:700;cursor:pointer}
.lhb button.g{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.6)}
.tkbar{display:flex;gap:8px;margin-top:14px;align-items:center}
.tkbar input{flex:1;margin:0}
.tkc{margin-top:10px;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tkc.full{border-color:#b9d8c5}
.tkh{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:13px 14px;cursor:pointer;text-align:start;color:var(--ink)}
.tkh b{flex:1;min-width:0;font-size:15.5px}
.tkh span{font-size:12.5px;font-weight:600;color:var(--muted);background:var(--soft);border-radius:999px;padding:2px 10px;direction:ltr}
.tkc.full .tkh span{background:var(--ok);color:#fff}
.tkh i{font-style:normal;color:var(--muted);font-size:13px}
.tkb{padding:0 14px 14px}
.tkg{font-size:12.5px;font-weight:700;color:var(--brand2);margin:10px 0 6px}
.tki{font-size:12.5px;color:var(--muted);line-height:1.7;margin-bottom:6px}
.tkr{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px dashed var(--line)}
.tkr > span{flex:1;min-width:0;font-size:14px}
.tkr > span u{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--cv);margin-inline-end:7px}
.tkr .roles{flex-shrink:0;flex-wrap:nowrap}
.tkr .tri{min-width:58px}
.ltop{padding:22px 4px 0}
.ltop b{display:block;font-family:'Aref Ruqaa',serif;font-size:31px;line-height:1.3;color:var(--brand)}
.ltop span{display:block;color:var(--muted);font-size:14px}
.dstrip{display:flex;gap:8px;margin-top:14px}
.dstrip .chip{flex:1;border-radius:14px;padding:8px 2px 7px;text-align:center;line-height:1.25}
.dstrip .chip small{display:block;font-size:11.5px;opacity:.85}
.dstrip .chip b{display:block;font-size:19px}
.dstrip .chip u{display:block;text-decoration:none;font-size:10.5px;font-weight:600;color:var(--gold)}
.dstrip .chip.on u{color:#f1d596}
.lbar{height:8px;border-radius:99px;background:var(--soft);margin-top:16px;overflow:hidden}
.lbar i{display:block;height:100%;background:#f2c230;border-radius:99px}
.lbt{font-size:12.5px;color:var(--muted);margin-top:5px}
.lslots{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.lslots .row{background:#fff;border:1.5px dashed #c7d3ca;border-radius:16px;padding:12px;flex-wrap:nowrap;gap:12px}
.lslots .row.done{border-style:solid;border-color:var(--line);background:#fff}
.lslots .pb{width:52px;height:56px;border-radius:14px;background:var(--cv);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:21px;line-height:1;flex-shrink:0}
.lslots .pb small{font-size:10px;font-weight:500;opacity:.9;margin-bottom:4px}
.lslots .nm b{font-size:16px;white-space:normal}
.lslots .nm small{font-size:13px}
.lslots .nm q{display:block;quotes:"«" "»";font-size:13.5px;margin-top:4px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lslots .dn{width:26px;height:26px;border-radius:50%;background:var(--ok);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0}
.lnone{margin-top:14px;border:1.5px dashed #c7d3ca;border-radius:16px;padding:18px;text-align:center;color:var(--muted)}
.ladd{width:100%;margin-top:10px;border:1.5px dashed var(--brand2);background:transparent;color:var(--brand2);border-radius:16px;padding:14px;font-weight:600;cursor:pointer}
.lform{margin-top:16px}
.lform .chg{position:relative;margin-top:10px;border:1px solid rgba(255,255,255,.65);background:transparent;color:#fff;border-radius:999px;padding:4px 12px;font-size:12.5px;cursor:pointer}
.lfb{padding:8px 16px 20px}
.lfsel{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;padding-bottom:14px;border-bottom:1px dashed var(--line)}
.lfsel[hidden]{display:none}
.lfsel .full{grid-column:1/-1}
label.lf{display:block;margin:16px 0 7px}
label.lf b{display:block;font-size:15.5px}
label.lf span{display:block;font-size:12.5px;color:var(--muted);line-height:1.6}
.lfb input#lfTitle{font-size:17px;font-weight:600;padding:13px 12px}
.lfb textarea{display:block;width:100%;resize:none;border:1px solid var(--line);border-radius:10px;padding:0 12px;line-height:32px;font-size:15.5px;overflow:hidden}
.lfb textarea.lta{min-height:130px;background:#fff repeating-linear-gradient(transparent 0,transparent 31px,#e4ecee 31px,#e4ecee 32px);background-attachment:local}
.lfb textarea.lhwt{min-height:66px;background:#fff8cf;border-color:#ecd9a8}
.lfb input:focus,.lfb textarea:focus,.lfb select:focus{outline:2px solid var(--brand2);outline-offset:1px}
.lpv{margin:22px 4px 8px;font-weight:600;color:var(--muted);font-size:13.5px}
.lhid .nm{opacity:.55}
input[type=text]#lfTitle{margin-top:0}
.row.ltext{border-top:0;padding-top:0}
.row.ltext .nm small{white-space:normal;line-height:1.7;font-size:12.5px}
.row.lrow .nm b{white-space:normal}
.c0{--cv:#2c9a67;--cd:#237b52}.c1{--cv:#3a7fc2;--cd:#2c669e}.c2{--cv:#df6a5c;--cd:#bb5246}.c3{--cv:#23a0a0;--cd:#198080}
.c4{--cv:#e3a326;--cd:#bb851a}.c5{--cv:#8c66cc;--cd:#704fa8}.c6{--cv:#7aa637;--cd:#618629}.c7{--cv:#d95c93;--cd:#b44777}
.welc{text-align:center;padding:34px 10px 14px}
.welc .wleaf{width:104px;height:104px;margin:0 auto 16px}
.welc .wleaf svg{width:100%;height:100%;overflow:visible}
.welc .st{stroke-dasharray:62;animation:wst .5s ease-out backwards}
.welc .l1,.welc .l2,.welc .l3{transform-box:fill-box;animation:wlf .45s cubic-bezier(.2,1.4,.4,1) backwards}
.welc .l1{transform-origin:100% 100%;animation-delay:.35s}
.welc .l2{transform-origin:0 100%;animation-delay:.55s}
.welc .l3{transform-origin:50% 100%;animation-delay:.8s}
@keyframes wst{from{stroke-dashoffset:62}}
@keyframes wlf{from{transform:scale(0)}}
@media (prefers-reduced-motion:reduce){.welc .st,.welc .l1,.welc .l2,.welc .l3{animation:none}}
.welc h2{font-family:'Aref Ruqaa',serif;font-size:29px;line-height:1.4;margin:0;color:var(--brand)}
.welc p{margin:4px 0 0;color:var(--muted);font-size:15px}
.wbtn{display:flex;align-items:center;gap:14px;width:100%;margin-top:12px;padding:16px;border-radius:16px;border:1.5px solid var(--line);background:#fff;cursor:pointer;text-align:start;color:var(--ink)}
.wbtn.par{background:var(--brand);border-color:var(--brand);color:#fff;padding:20px 16px}
.wbtn:active{transform:scale(.985)}
.wbtn:focus-visible,.stile:focus-visible,.grd button:focus-visible,.pact button:focus-visible,.pback:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wbtn .wic{width:46px;height:46px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--brand2)}
.wbtn.par .wic{color:#f1d596}
.wbtn .wic svg{width:36px;height:36px}
.wbtn .wtx{flex:1;min-width:0}
.wbtn .wtx b{display:block;font-family:'Aref Ruqaa',serif;font-size:24px;line-height:1.3}
.wbtn .wtx small{display:block;margin-top:2px;font-size:13px;opacity:.82;line-height:1.7}
.ptitle{padding:26px 4px 4px}
.ptitle b{display:block;font-family:'Aref Ruqaa',serif;font-size:27px;line-height:1.4;color:var(--brand)}
.ptitle span{display:block;margin-top:4px;color:var(--muted);font-size:13.5px;line-height:1.7}

<body>
<header class="top"><div class="in">

  <div><h1 id="ttl">مدرسة البراعم</h1><small id="ttlSub">صفحة المعلم — المتابعة الشهرية وزيارات الحصص</small></div>
  <div class="who" id="who"></div>
</div></header>
<div class="wrap" id="app"></div>
<footer class="save" id="savebar" style="display:none"><div class="in">
  <div class="st" id="st">لا توجد تغييرات</div>
  <button class="btn" id="saveBtn" disabled>حفظ</button>
</div></footer>
<div class="loading" id="loading">جارٍ التحميل…</div>
<script>
var S = {boot:null, teacher:'', pin:'', month:'', sup:false, view:'login', home:null,
         cls:'', data:null, tab:'grades', subject:'', si:0, quick:0, group:0, item:0,
         acad:{}, edu:{}, det:{}, orig:{acad:{}, edu:{}, det:{}}, open:{}, dirty:false,
         vinit:null, v:null, vItem:0, homes:{}, classes:{}, att:null, tk:null, tg:null, asSup:false, finit:null, f:null, li:null, lf:null, ls:null, lDay:'', parent:'', pl:null, plErr:'', pSub:'', pY:0, pNew:null};
var app = document.getElementById('app');
var NOTES = [{key:'أبرز ما تحسّن', label:'أبرز ما تحسّن'}, {key:'ما يحتاج متابعة', label:'ما يحتاج متابعة'}];
var LEAVE = 'لديك تغييرات غير محفوظة. هل تريد المتابعة دون حفظ؟';

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
var busy=0;
function load(on){ busy=Math.max(0,busy+(on?1:-1)); document.getElementById('loading').classList.toggle('on',busy>0); }
var API_URL='https://script.google.com/macros/s/AKfycbwVRJuchV8FGt_BRcCIJjmh4TwzE74CHZ-OYwH9Bml-yEMfEaJbPqxMDDNOygqTuF3BeA/exec';
var IS_APP='yes'==='yes';  // true only in the installable app on GitHub Pages
function call(fn,args,ok,onFail,quiet){
  var shown=!quiet; if(shown) load(true);
  function done(){ if(shown){ shown=false; load(false); } }
  function fail(m){ done(); if(onFail){ onFail(m); return; } status('err', m || 'حدث خطأ، حاول مرة أخرى'); }
  function viaScriptRun(){
    if(!(window.google && google.script && google.script.run)){ fail('تعذّر الاتصال بالخادم. تأكد من الإنترنت ثم أعد المحاولة.'); return; }
    var r = google.script.run.withSuccessHandler(function(x){done();ok(x);})
      .withFailureHandler(function(e){ fail(e && e.message); });
    r[fn].apply(r,args);
  }
  if(API_URL.indexOf('https://')!==0 || !window.fetch){ viaScriptRun(); return; }
  var ctl=window.AbortController? new AbortController() : null, timer=setTimeout(function(){ if(ctl) ctl.abort(); }, 60000);
  fetch(API_URL,{method:'POST',credentials:'omit',redirect:'follow',keepalive:(fn==='webPunch'),headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args}),signal:ctl?ctl.signal:undefined})
    .then(function(r){ if(!r.ok) throw new Error('http'); return r.json(); })
    .then(function(res){
      clearTimeout(timer);
      if(res && res.ok){ done(); setTimeout(function(){ ok(res.v); },0); } else fail(res && res.err);
    }, function(e){
      clearTimeout(timer);
      if(e && e.name==='AbortError'){ fail('انتهت مهلة الاتصال. تحقّق من الإنترنت ثم أعد المحاولة؛ إن كنت حفظت، افتح الصفحة من جديد لترى هل وصل الحفظ.'); return; }
      if(!IS_APP && window.google && google.script && google.script.run) viaScriptRun(); else fail('تعذّر الاتصال بالخادم. تأكد من الإنترنت ثم أعد المحاولة.');
    });
}
function store(k,v){try{ if(v===undefined) return localStorage.getItem(k); if(v===null) localStorage.removeItem(k); else localStorage.setItem(k,v);}catch(e){return null;}}
function forget(){ store('albaraem_pin',null); store('albaraem_home',null); S.pin=''; S.homes={}; S.classes={}; S.home=null; S.att=null; S.attAt=0; S.attBusy=false; S.vinit=null; S.v=null; S.tk=null; S.tg=null; S.mi=null; S.mt=null; S.li=null; S.lf=null; S.ls=null; S.dirty=false; }
function jget(k){ try{ return JSON.parse(store(k)||'null'); }catch(e){ return null; } }
function jput(k,v){ try{ store(k,JSON.stringify(v)); }catch(e){} }
function thisMonth(months,fallback){ var d=new Date(), m=(d.getMonth()+1)+'/'+d.getFullYear(); return months.indexOf(m)>=0 ? m : (fallback && months.indexOf(fallback)>=0 ? fallback : months[0]); }
function hkey(){ return S.teacher+'|'+S.month; }
function status(kind,msg){var st=document.getElementById('st'); st.className='st '+(kind||''); st.textContent=msg; if(kind==='err') document.getElementById('savebar').style.display='block';}
function setDirty(d){S.dirty=d; document.getElementById('saveBtn').disabled=!d; status(d?'dirty':'', d?'تغييرات غير محفوظة':'لا توجد تغييرات');}
function leave(fn){ if(S.dirty && !confirm(LEAVE)) return; setDirty(false); fn(); }
function clone(o){return JSON.parse(JSON.stringify(o||{}));}
function keep(fn){var y=window.scrollY; fn(); window.scrollTo(0,y);}
window.addEventListener('beforeunload',function(e){ if(S.dirty){e.preventDefault(); e.returnValue='';} });

// ---------------------------------------------------------------- login
function start(){
  function cantLoad(){ load(false); app.innerHTML='<div class="card"><h2>تعذّر تحميل الصفحة</h2><div class="hint" style="margin-top:0">تأكد من اتصال الإنترنت ثم أعد المحاولة.'+(IS_APP?'':' إذا كنت مسجّلًا بأكثر من حساب Google في هذا المتصفح، افتح الرابط في نافذة خاصة (Incognito) أو من الجوال.')+'</div><button class="btn block" onclick="location.reload()">إعادة المحاولة</button></div>'; }
  setTimeout(function(){ if(!S.boot && !S.home && !S.parent) cantLoad(); }, 15000);
  var cached=jget('albaraem_boot'), savedPin=store('albaraem_pin');
  // a parent: the class link, or the class this phone opened last (a signed-in teacher's phone stays the teacher's)
  var pid=parentId() || (savedPin===null ? (store('albaraem_parent')||'') : '');
  if(pid){ if(cached) S.boot=cached; openParent(pid); return; }
  S.teacher=store('albaraem_teacher')||'';
  function known(b){ return b && b.teachers.some(function(x){return x.name===S.teacher;}); }
  function gotBoot(b){ S.boot=b; jput('albaraem_boot',b); }
  if(S.teacher && savedPin!==null && known(cached)){
    // remembered login: show the last home page at once, then refresh boot + home together (one round trip)
    S.boot=cached; S.pin=savedPin; S.month=thisMonth(cached.months,cached.currentMonth);
    var last=jget('albaraem_home');
    if(last && last.key===hkey()){ S.homes[hkey()]=last.h; S.home=last.h; S.sup=!!last.h.supervisor; renderHome(); }
    call('webBootstrap',[],gotBoot,function(){},true);
    homeFetch(!S.home, function(m){
      if(/غير صحيح|غير موجود|لا يوجد رمز/.test(m||'')){ forget(); renderLogin(); return; }
      if(S.home) return;   // keep showing the cached page
      app.innerHTML='<div class="card"><h2>تعذّر الاتصال</h2><div class="hint" style="margin-top:0">'+esc(m||'تأكد من اتصال الإنترنت ثم أعد المحاولة.')+'</div><button class="btn block" onclick="location.reload()">إعادة المحاولة</button></div>';
    });
    return;
  }
  if(cached){ S.boot=cached; S.month=thisMonth(cached.months,cached.currentMonth); renderEntry(); call('webBootstrap',[],function(b){ gotBoot(b); var ch=JSON.stringify(b.teachers)!==JSON.stringify(cached.teachers) || !!b.parents!==!!cached.parents; if(ch && S.view==='login') renderLogin(); else if(ch && S.view==='welcome') renderEntry(); },function(){},true); return; }
  call('webBootstrap',[],function(b){ gotBoot(b); S.month=thisMonth(b.months,b.currentMonth); renderEntry(); }, cantLoad);
}
function renderLogin(){
  S.view='login'; S.parent=''; ttlSub('');
  document.getElementById('savebar').style.display='none';
  document.getElementById('who').innerHTML='';
  var b=S.boot, t=b.teachers, opts='<option value="">— اختر اسمك —</option>';
  t.forEach(function(x){opts+='<option value="'+esc(x.name)+'"'+(x.name===S.teacher?' selected':'')+'>'+esc(x.name)+'</option>';});
  var mo=''; b.months.forEach(function(m){mo+='<option value="'+esc(m)+'"'+(m===S.month?' selected':'')+'>'+esc(m)+'</option>';});
  app.innerHTML='<div class="ptitle"><b>دخول المعلمين</b><span>اختر اسمك واكتب رمزك.</span></div><div class="card">'+
    '<label class="f">الاسم</label><select id="tSel">'+opts+'</select>'+
    '<div id="pinBox"></div>'+
    '<label class="f">الشهر</label><select id="mSel">'+mo+'</select>'+
    '<button class="btn block" id="go">دخول</button>'+
    '<div class="hint">رمز الدخول أربعة أرقام تأخذه من الإدارة. يتذكّر هذا الجهاز دخولك، فلا تحتاج لكتابته مرة أخرى حتى تضغط «خروج».</div></div>'+
    (b.parents && b.parents.length ? '<button class="pback" id="lBack">› رجوع</button>' : '');

    var x=t.filter(function(y){return y.name===tSel.value;})[0];

  }

// phone back button: inside a page it goes to the home page (asking first if something is unsaved) instead of closing the app
var navOn=false;
window.addEventListener('popstate',function(){
  navOn=false;
  if(S.view==='psub'){ renderParent(); return; }
  if(S.view==='home'||S.view==='login'||S.view==='parent'||S.view==='ppick'||S.view==='welcome') return;
  if(S.dirty && !confirm(LEAVE)){ navMark(); return; }
  setDirty(false); goHome();
});
function navMark(){ if(navOn||S.view==='home'||S.view==='login') return; try{ history.pushState({albaraem:1},''); navOn=true; }catch(e){} }
function who(){
  navMark();
  document.getElementById('who').innerHTML=esc(S.teacher)+' · '+esc(S.month)+'<br>'+
    (S.view!=='home'?'<a id="homeL">الرئيسية</a>':'')+'<a id="out">خروج</a>';

// ---------------------------------------------------------------- home: my evaluations + visits
function gotHome(h){
  if(h && h.adm && h.adm.err){ var prev=S.home||S.homes[hkey()]||(jget('albaraem_home')||{}).h; h.adm=(prev && prev.adm && !prev.adm.err)? prev.adm : {}; }
  if(h && h.att){ if(!punch.on){ S.att=h.att; S.attAt=Date.now(); } delete h.att; }   // not kept with the cached home: it is today's only
  S.home=h; S.sup=!!h.supervisor; S.homes[hkey()]=h; jput('albaraem_home',{key:hkey(),h:h}); }
function homeFetch(loud,onFail,force){
  var k=hkey(), v0=S.view;
  call('webHome',[S.teacher,S.pin,S.month],function(h){
    var att0=JSON.stringify(S.att), hadAtt=!!(h&&h.att), old=JSON.stringify(S.homes[k]);
    gotHome(h);
    var changed=JSON.stringify(h)!==old || (hadAtt && JSON.stringify(S.att)!==att0);
    // redraw only while the teacher is looking at the home page (or asked for it) — never over a class or a visit opened meanwhile
    if(S.pin && hkey()===k && (S.view==='login' || (force && S.view===v0) || (S.view==='home' && changed))) renderHome();
  }, onFail, !loud);
}
function goHome(){
  var c=S.homes[hkey()];
  if(c){ S.home=c; S.sup=!!c.supervisor; renderHome(); homeFetch(false,function(){}); }
  else homeFetch(true,undefined,true);
}
function renderHome(){
  S.view='home'; S.asSup=false; who(); setTimeout(prefetchClasses, 600); setTimeout(obFlush, 300);
  document.getElementById('savebar').style.display='none';
  var h=S.home, done={}, html='<div class="greet"><b>أهلًا '+esc(S.teacher)+'</b><span>'+esc(lLabel(localIso()))+'</span></div>'+installCard()+attCard()+lesHomeCard()+rolesCard()+'<div class="card"><h2>تقييماتي الشهرية</h2>'+
    '<div class="mrow"><span>الشهر</span><select id="hMonth">'+S.boot.months.map(function(m){return '<option value="'+esc(m)+'"'+(m===S.month?' selected':'')+'>'+esc(m)+'</option>';}).join('')+'</select></div>';
  if(h.classes.length){
    html+='<div class="list">';
    h.classes.forEach(function(c){
      done[c.cls]=true;
      var parts=[]; if(c.parts[0]) parts.push('علامات/سلوك'); if(c.parts[2]) parts.push('مهارات/ملاحظات'); if(c.parts[1]) parts.push('تربوي');
      html+='<div class="row"><div class="nm"><b>'+esc(c.cls)+'</b><small>'+c.n+' طالبًا · '+esc(parts.join('، '))+'</small></div>'+
        '<button class="btn ghost sm" data-open="'+esc(c.cls)+'">تعديل</button></div>';

  document.getElementById('savebar').style.display='block'; document.getElementById('saveBtn').style.display=''; document.getElementById('saveBtn').textContent='حفظ';
  var full=0; d.teachers.forEach(function(t){ var n=tkItems(t).length; if(n && tkDone(t)===n) full++; });
  var fold=!!d.per && d.kind==='tasks';                     // long cards: one teacher open at a time
  var h='<div class="ltop"><b>'+title+'</b><span>'+esc(d.month)+' · اكتمل '+full+' من '+d.teachers.length+'</span></div>'+
    '<div class="tkbar"><input type="text" id="tkQ" placeholder="بحث باسم المعلم/ة" value="'+esc(d.q||'')+'"><button class="btn ghost sm" id="back">رجوع</button></div>'+
    '<div class="hint" style="margin-top:8px">'+(prep?'لكل معلم/ة زرّان في الشهر (التحضير يُرفع كل أسبوعين): اختر «تم» أو «لم يتم» أو «لم يكن مطلوبًا». اضغط الاختيار مرة ثانية لمسحه.'
      :'اضغط الخانة: مرة = ✓ '+(quran?'شاهد':'تم')+'، مرتين = ✗ '+(quran?'لم يشاهد':'لم يتم')+'، ثلاثًا = فارغ.')+
      (d.per?' يظهر لكل معلم/ة ما هو مطلوب منه فقط.':'')+'</div>';
  if(!d.teachers.length) h+='<div class="lnone">لا أحد مطلوب منه شيء في هذه الصفحة لهذا الشهر.</div>';
  var q=String(d.q||'').trim();
  d.teachers.forEach(function(t,i){
    if(q && t.indexOf(q)<0) return;
    var items=tkItems(t), n=items.length, dn=tkDone(t), open=!fold || !!d.open[t] || !!q;
    h+='<div class="tkc'+(dn===n?' full':'')+(open?' open':'')+'"><button class="tkh" data-tko="'+i+'"><b>'+esc(t)+'</b><span>'+dn+' / '+n+'</span>'+(fold?'<i>'+(open?'▴':'▾')+'</i>':'')+'</button>';
    if(open){ h+='<div class="tkb">';
      if(prep){
        if(items[0]&&items[0].info) h+='<div class="tki">المواد: '+esc(items[0].info)+'</div>';
        items.forEach(function(it,j){ var v=tkGet(t,it.key);
          h+='<div class="tkr"><span>'+esc(it.label)+'</span><div class="opts">'+d.states.map(function(s,k){ return '<button class="s'+(k===0?0:k===1?2:3)+(v===s?' on':'')+'" data-tt="'+i+'" data-tj="'+j+'" data-tv="'+esc(s)+'">'+esc(s)+'</button>'; }).join('')+'</div></div>'; });
      } else {
        var flat=items.filter(function(it){ return !it.sub; }), g='';
        if(flat.length){ if(flat[0].group) h+='<div class="tkg">'+esc(flat[0].group)+'</div>'; h+='<div class="roles">';
          items.forEach(function(it,j){ if(it.sub) return; h+=tkTri(t,i,it,j, d.per||quran ? it.label : it.label.replace('الاجتماع ','').replace('المنهاج المنجز','المنهاج')); });
          h+='</div>'; }
        var last='';
        items.forEach(function(it,j){ if(!it.sub) return;
          if(it.group!==g){ g=it.group; h+='<div class="tkg">'+esc(g)+'</div>'; }
          if(it.sub!==last){ if(last) h+='</div></div>'; last=it.sub; h+='<div class="tkr"><span><u class="c'+lesColor(it.sub)+'"></u>'+esc(it.sub)+'</span><div class="roles">'; }
          h+=tkTri(t,i,it,j,it.label); });
        if(last) h+='</div></div>';
      }
      h+='</div>'; }
    h+='</div>';
  });
  app.innerHTML=h;
  document.getElementById('back').onclick=function(){ leave(goHome); };
  var qi=document.getElementById('tkQ'); qi.oninput=function(){ d.q=qi.value; var p=qi.selectionStart; renderTasks(); var e=document.getElementById('tkQ'); e.focus(); try{ e.setSelectionRange(p,p); }catch(x){} };
  app.querySelectorAll('[data-tko]').forEach(function(b){ b.onclick=function(){ if(!fold) return; var t=d.teachers[+b.getAttribute('data-tko')]; var was=!!d.open[t]; d.open={}; if(!was) d.open[t]=true; keep(renderTasks); }; });
  app.querySelectorAll('[data-tj]').forEach(function(b){ b.onclick=function(){
    var t=d.teachers[+b.getAttribute('data-tt')], k=tkItems(t)[+b.getAttribute('data-tj')].key, v=tkGet(t,k), pick=b.getAttribute('data-tv');
    if(!d.cur[t]) d.cur[t]={};
    d.cur[t][k]= pick!==null ? (v===pick?'':pick) : (v===''?'نعم':v==='نعم'?'لا':'');
    setDirty(true); keep(renderTasks);
  }; });
}
function saveTasks(){
  var d=S.tk, out={}, n=0;
  d.teachers.forEach(function(t){ tkItems(t).forEach(function(it){ var a=tkGet(t,it.key), b=(d.values[t]||{})[it.key]||''; if(a!==b){ (out[t]=out[t]||{})[it.key]=a; n++; } }); });
  if(!n){ setDirty(false); return; }
  call('webTasksSave',[S.teacher,S.pin,d.kind,d.month,out],function(r){ d.values=clone(d.cur); S.dirty=false; document.getElementById('saveBtn').disabled=true; status('ok','تم الحفظ ✓ ('+r.saved+')'); keep(renderTasks); });
}
function openTg(date){ call('webTgLoad',[S.teacher,S.pin,date],function(d){ S.tg=d; S.tg.cur=clone(d.values); S.view='tg'; setDirty(false); renderTg(); }); }
function renderTg(){
  who(); var d=S.tg, st=d.statuses;
  document.getElementById('savebar').style.display='block'; document.getElementById('saveBtn').style.display=''; document.getElementById('saveBtn').textContent='حفظ';
  var h='<div class="card"><h2>تنزيلات التيليجرام<span class="grow"></span><button class="fill" id="back">رجوع</button></h2>'+
    '<div class="mrow"><span>اليوم</span><input type="date" id="tgDate" value="'+esc(d.date)+'" max="'+esc(d.today)+'" style="width:auto;flex:1;max-width:200px;padding:8px 10px"><span>'+esc(d.day)+'</span></div>'+

    '<div class="bar"><span class="grow"></span><button class="fill" id="tgFill">عبّئ الفارغ: «نزّل» لمن عليه دوام، «لا يوجد» للباقي</button></div></div><div class="list" style="margin-top:6px">';
  var short={'نزّل':'نزّل','نزّل متأخرًا':'متأخر','لم ينزّل':'لم ينزّل','لا يوجد تنزيل':'لا يوجد'};
  d.teachers.slice().sort(function(a,b){ return (b.scheduled?1:0)-(a.scheduled?1:0); }).forEach(function(t){
    var v=d.cur[t.name]||'';
    h+='<div class="row'+(t.scheduled?'':' dimrow')+'"><div class="nm"><b>'+esc(t.name)+'</b><small>'+(t.scheduled?'عليه دوام اليوم':'ليس عليه دوام اليوم')+'</small></div><div class="opts">';
    st.forEach(function(x,j){ h+='<button class="s'+j+(v===x?' on':'')+'" data-tgn="'+esc(t.name)+'" data-tgv="'+esc(x)+'">'+esc(short[x]||x)+'</button>'; });

  app.innerHTML=h+'</div>';
  document.getElementById('back').onclick=function(){ leave(goHome); };
  document.getElementById('tgDate').onchange=function(){ var inp=this, v=inp.value;
    if(!v || (S.dirty && !confirm(LEAVE))){ inp.value=d.date; return; }
    call('webTgLoad',[S.teacher,S.pin,v],function(n){ S.tg=n; S.tg.cur=clone(n.values); setDirty(false); renderTg(); },function(m){ inp.value=d.date; status('err',m||'حدث خطأ، حاول مرة أخرى'); }); };
  document.getElementById('tgFill').onclick=function(){ d.teachers.forEach(function(t){ if(!d.cur[t.name]){ d.cur[t.name]= t.scheduled?'نزّل':'لا يوجد تنزيل'; } }); setDirty(true); keep(renderTg); };
  app.querySelectorAll('[data-tgn]').forEach(function(b){ b.onclick=function(){
    var n=b.getAttribute('data-tgn'), v=b.getAttribute('data-tgv'); d.cur[n]= d.cur[n]===v ? '' : v; setDirty(true); keep(renderTg);
  }; });
}
function saveTg(){
  var d=S.tg, out={}, n=0;
  d.teachers.forEach(function(t){ var a=d.cur[t.name]||'', b=d.values[t.name]||''; if(a!==b){ out[t.name]=a; n++; } });
  if(!n){ setDirty(false); return; }
  call('webTgSave',[S.teacher,S.pin,d.date,out],function(r){ d.values=clone(d.cur); S.dirty=false; document.getElementById('saveBtn').disabled=true; status('ok','تم الحفظ ✓ ('+r.saved+')'); });
}

// ---------------------------------------------------------------- parents' meetings (whoever is named in the settings, AS14)
function openMeets(){ call('webMeetInit',[S.teacher,S.pin],function(I){ S.mi=I; setDirty(false); renderMeets(); }); }
function meetCount(x){ var p=[];
  if(x.momIn!==''&&x.momIn!=null) p.push('الأمهات: حضرت '+x.momIn+'، غابت '+x.momOut);
  if(x.dadIn!==''&&x.dadIn!=null) p.push('الآباء: حضر '+x.dadIn+'، غاب '+x.dadOut);
  if(+x.open) p.push('لم يُحدَّد '+x.open); return p.join(' · '); }
function renderMeets(){
  S.view='meets'; who(); var I=S.mi;
  document.getElementById('savebar').style.display='none';
  var h='<div class="card"><h2>اجتماعات الأهالي<span class="grow"></span><button class="btn sm" id="newM">＋ اجتماع جديد</button></h2>';
  if(I.list.length){ h+='<div class="list">';
    I.list.forEach(function(m){ h+='<div class="row"><div class="nm"><b>'+esc(m.date)+' · '+esc(m.type)+'</b><small>'+(m.title?esc(m.title)+' · ':'')+esc(meetCount(m))+'</small></div><button class="btn ghost sm" data-meet="'+esc(m.id)+'">تعديل</button></div>'; });
    h+='</div>'; }
  else h+='<div class="hint" style="margin-top:0">لا توجد اجتماعات مسجّلة بعد.</div>';
  h+='<div class="hint">اختر نوع الاجتماع والصفوف، ثم علّم لكل طالب: حضرت والدته أو غابت، وحضر والده أو غاب. الإخوة يُعلَّمون معًا، والأعداد تحسب الأم والأب مرة واحدة.</div></div>';
  app.innerHTML=h;
  document.getElementById('newM').onclick=function(){ var I=S.mi; S.mt={id:'',date:I.today,type:'',title:'',classes:I.classes.slice(),notes:'',att:{}}; S.mOpen={}; setDirty(false); renderMeet(); };
  app.querySelectorAll('[data-meet]').forEach(function(b){ b.onclick=function(){
    call('webMeetLoad',[S.teacher,S.pin,b.getAttribute('data-meet')],function(m){ S.mt=m; S.mOpen={}; setDirty(false); renderMeet(); }); }; });
}
function meetRoles(t){ var i=S.mi.types.indexOf(t); return i===0?['mom']:i===1?['dad']:i===2?['mom','dad']:[]; }
function kidW(cls){ return cls.indexOf('إناث')===0?'الطالبة':cls.indexOf('ذكور')===0?'الطالب':'الطالب/ة'; }
function mget(n,r){ return S.mt.att[n+'|'+r]||{v:'',note:''}; }
function mput(n,r,f,v){ var k=n+'|'+r; if(!S.mt.att[k]) S.mt.att[k]={v:'',note:''}; S.mt.att[k][f]=v; setDirty(true); }
function meetKids(){ var m=S.mt, I=S.mi, out=[]; I.classes.forEach(function(c){ if(m.classes.indexOf(c)<0) return; (I.students[c]||[]).forEach(function(s){ out.push({n:s.n,m:s.m,f:s.f,c:c}); }); }); return out; }
function sibs(k,all){ if(!k.f) return []; return all.filter(function(x){ return x.f===k.f && x.n!==k.n; }); }
function meetStats(all){ var roles=meetRoles(S.mt.type), st={};
  roles.forEach(function(r){ var a={}, b={}, open=0; all.forEach(function(k){ var v=mget(k.n,r).v, f=k.f||k.n; if(v==='حضر') a[f]=1; else if(v==='غاب') b[f]=1; else open++; });
    Object.keys(a).forEach(function(f){ delete b[f]; }); st[r]={inn:Object.keys(a).length, out:Object.keys(b).length, open:open}; });
  return st; }
function renderMeet(){
  S.view='meet'; who(); var I=S.mi, m=S.mt, roles=meetRoles(m.type), all=meetKids();
  document.getElementById('savebar').style.display='block'; document.getElementById('saveBtn').style.display=''; document.getElementById('saveBtn').textContent='حفظ الاجتماع';
  var h='<div class="card"><h2>'+(m.id?'تعديل اجتماع':'اجتماع أهالي جديد')+'<span class="grow"></span><button class="fill" id="back">رجوع</button></h2>'+
    '<div class="grid2"><div><label class="f">تاريخ الاجتماع</label><input type="date" id="mD" value="'+esc(m.date)+'"></div>'+
    '<div><label class="f">عنوان الاجتماع (اختياري)</label><input type="text" id="mT" value="'+esc(m.title)+'"></div></div>'+
    '<label class="f">نوع الاجتماع</label><div class="mty">';
  I.types.forEach(function(t,i){ h+='<button data-mty="'+i+'"'+(m.type===t?' class="on"':'')+'>'+esc(t)+'</button>'; });
  h+='</div><label class="f">الصفوف</label><div class="chips small"><button class="chip'+(m.classes.length===I.classes.length?' on':'')+'" id="mAll">كل الصفوف</button>';
  I.classes.forEach(function(c){ h+='<button class="chip'+(m.classes.indexOf(c)>=0?' on':'')+'" data-mc="'+esc(c)+'">'+esc(c)+'</button>'; });
  h+='</div></div>';
  if(!roles.length) h+='<div class="card empty">اختر نوع الاجتماع لتظهر أسماء الأهالي.</div>';
  else if(!all.length) h+='<div class="card empty">اختر صفًا واحدًا على الأقل.</div>';
  else {
    var st=meetStats(all);
    h+='<div class="card"><div class="mstat">'+
      (st.mom?'<div>الأمهات: <b>حضرت '+st.mom.inn+'</b> · غابت '+st.mom.out+(st.mom.open?' · <span style="color:var(--warn)">لم يُحدَّد '+st.mom.open+' طالبًا</span>':'')+'</div>':'')+
      (st.dad?'<div>الآباء: <b>حضر '+st.dad.inn+'</b> · غاب '+st.dad.out+(st.dad.open?' · <span style="color:var(--warn)">لم يُحدَّد '+st.dad.open+' طالبًا</span>':'')+'</div>':'')+
      '</div><div class="bar" style="margin-bottom:0"><span class="grow"></span><button class="fill" id="mFill">علّم الباقي: غياب</button></div></div>';
    var cur='', i=0;
    all.forEach(function(k){
      if(k.c!==cur){ if(cur) h+='</div>'; cur=k.c; h+='<div class="bar"><b>'+esc(cur)+'</b></div><div class="list">'; }
      var sb=sibs(k,all);
      roles.forEach(function(r){
        var x=mget(k.n,r), mom=r==='mom', key=k.n+'|'+r;
        h+='<div class="row mt"><div class="nm"><b>'+(mom?'والدة ':'والد ')+kidW(k.c)+' '+esc(k.n)+'</b>'+
          ((mom&&k.m)||sb.length?'<small>'+(mom&&k.m?esc(k.m):'')+(mom&&k.m&&sb.length?' · ':'')+(sb.length?'مع: '+esc(sb.map(function(y){return y.n;}).join('، ')):'')+'</small>':'')+'</div>'+
          '<div class="opts"><button class="s0'+(x.v==='حضر'?' on':'')+'" data-mi="'+i+'" data-mr="'+r+'" data-mv="حضر">'+(mom?'حضرت':'حضر')+'</button>'+
          '<button class="s2'+(x.v==='غاب'?' on':'')+'" data-mi="'+i+'" data-mr="'+r+'" data-mv="غاب">'+(mom?'غابت':'غاب')+'</button></div>'+
          '<button class="nb'+(x.note?' has':'')+'" data-mnb="'+i+'" data-mr="'+r+'" title="ملاحظة اختيارية">✎'+(x.note?' ملاحظة':'')+'</button>'+
          (x.note||S.mOpen[key]?'<div class="noteRow"><textarea data-mnt="'+i+'" data-mr="'+r+'" placeholder="ملاحظة اختيارية (مثل: اعتذرت مسبقًا)">'+esc(x.note)+'</textarea></div>':'')+'</div>';
      });
      i++;
    });
    h+='</div>';
  }
  h+='<div class="card"><label class="f" style="margin-top:0">ملاحظات الاجتماع</label><textarea class="t" id="mN" style="width:100%;min-height:70px;padding:8px 10px;border:1px solid var(--line);border-radius:9px">'+esc(m.notes)+'</textarea>'+
    (m.id?'<div class="bar"><span class="grow"></span><button class="fill" id="mDel" style="color:var(--warn);border-color:var(--warn)">حذف هذا الاجتماع</button></div>':'')+'</div>';
  app.innerHTML=h;
  document.getElementById('back').onclick=function(){ leave(renderMeets); };
  document.getElementById('mD').onchange=function(){ m.date=this.value; setDirty(true); };
  document.getElementById('mT').oninput=function(){ m.title=this.value; setDirty(true); };
  document.getElementById('mN').oninput=function(){ m.notes=this.value; setDirty(true); };
  app.querySelectorAll('[data-mty]').forEach(function(b){ b.onclick=function(){ m.type=I.types[+b.getAttribute('data-mty')]; setDirty(true); keep(renderMeet); }; });
  document.getElementById('mAll').onclick=function(){ m.classes= m.classes.length===I.classes.length ? [] : I.classes.slice(); setDirty(true); keep(renderMeet); };
  app.querySelectorAll('[data-mc]').forEach(function(b){ b.onclick=function(){ var c=b.getAttribute('data-mc'), j=m.classes.indexOf(c); if(j>=0) m.classes.splice(j,1); else m.classes.push(c); setDirty(true); keep(renderMeet); }; });
  app.querySelectorAll('[data-mv]').forEach(function(b){ b.onclick=function(){
    var k=all[+b.getAttribute('data-mi')], r=b.getAttribute('data-mr'), v=b.getAttribute('data-mv'), nv=mget(k.n,r).v===v?'':v;
    mput(k.n,r,'v',nv); sibs(k,all).forEach(function(y){ mput(y.n,r,'v',nv); }); keep(renderMeet); }; });
  app.querySelectorAll('[data-mnb]').forEach(function(b){ b.onclick=function(){ var k=all[+b.getAttribute('data-mnb')], key=k.n+'|'+b.getAttribute('data-mr'); S.mOpen[key]=!S.mOpen[key]; keep(renderMeet); }; });
  app.querySelectorAll('[data-mnt]').forEach(function(t){ t.oninput=function(){ var k=all[+t.getAttribute('data-mnt')]; mput(k.n,t.getAttribute('data-mr'),'note',t.value); }; });
  var f=document.getElementById('mFill'); if(f) f.onclick=function(){ all.forEach(function(k){ roles.forEach(function(r){ if(!mget(k.n,r).v) mput(k.n,r,'v','غاب'); }); }); keep(renderMeet); };
  var d=document.getElementById('mDel'); if(d) d.onclick=function(){ if(!confirm('حذف هذا الاجتماع وكل ما سُجّل فيه من حضور وغياب؟')) return;
    call('webMeetDelete',[S.teacher,S.pin,m.id],function(){ setDirty(false); openMeets(); }); };
}
function saveMeet(){
  var m=S.mt, roles=meetRoles(m.type), all=meetKids();
  if(!m.date){ status('err','اكتب تاريخ الاجتماع.'); return; }
  if(!roles.length){ status('err','اختر نوع الاجتماع.'); return; }
  if(!all.length){ status('err','اختر صفًا واحدًا على الأقل.'); return; }
  var open=0, att={};
  all.forEach(function(k){ roles.forEach(function(r){ var x=mget(k.n,r); if(!x.v) open++; if(x.v||x.note) att[k.n+'|'+r]={v:x.v,note:x.note}; }); });
  if(open && !confirm('بقي '+open+' بلا تحديد (لا حضور ولا غياب). هل تحفظ الآن وتكمل لاحقًا؟')) return;
  call('webMeetSave',[{name:S.teacher,pin:S.pin,id:m.id,date:m.date,type:m.type,title:m.title,classes:m.classes,notes:m.notes,att:att}],function(r){
    m.id=r.id; S.dirty=false; document.getElementById('saveBtn').disabled=true;
    status('ok','حُفظ الاجتماع ✓ '+meetCount(r));
    call('webMeetInit',[S.teacher,S.pin],function(I){ S.mi=I; },function(){},true);
  });
}

// ---------------------------------------------------------------- install the app (PWA only)
var deferredInstall=null;
window.addEventListener('beforeinstallprompt',function(e){ e.preventDefault(); deferredInstall=e; if(S.view==='home') renderHome(); });
window.addEventListener('appinstalled',function(){ deferredInstall=null; store('albaraem_install_hide','1'); if(S.view==='home') renderHome(); });
function standalone(){ return (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone===true; }
function isIOS(){ return /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1); }
function installCard(){
  if(!IS_APP || standalone() || store('albaraem_install_hide')) return '';
  var body;
  if(deferredInstall) body='<div class="hint" style="margin-top:0">ثبّت «البراعم» على هاتفك ليفتح كتطبيق بضغطة واحدة.</div><button class="btn block" id="doInstall">تثبيت التطبيق</button>';
  else if(isIOS()) body='<div class="hint" style="margin-top:0">في سفاري: اضغط زر المشاركة <b>⬆︎</b> أسفل الشاشة، ثم اختر <b>«إضافة إلى الشاشة الرئيسية»</b>.</div>';
  else body='<div class="hint" style="margin-top:0">من قائمة المتصفح <b>⋮</b> اختر <b>«تثبيت التطبيق»</b> أو <b>«إضافة إلى الشاشة الرئيسية»</b>.</div>';
  return '<div class="card install"><h2>ثبّت التطبيق على هاتفك<span class="grow"></span><button class="fill" id="hideInstall">إخفاء</button></h2>'+body+'</div>';
}
function bindInstall(){

function clsKey(c,sup){ return hkey()+'|'+(sup?'sup|':'')+c; }
function openClass(c,sup){
  S.asSup=!!sup; sup=S.asSup;
  var ck=clsKey(c,sup);
  function show(d){
    S.cls=c; S.data=d; S.acad=clone(d.acad); S.edu=clone(d.edu); S.det=clone(d.det);
    S.orig={acad:clone(d.acad),edu:clone(d.edu),det:clone(d.det)}; S.open={};
    var rs=store('albaraem_subj|'+S.teacher+'|'+c); S.subject=(rs && d.subjects.indexOf(rs)>=0)? rs : (d.subjects[0]||''); S.si=0; S.quick=0; S.group=0; S.item=0; S.allItems=false;
    if(S.tab!=='grades'&&S.tab!=='quick'&&S.tab!=='edu') S.tab='grades';
    if(sup){ S.tab='edu'; S.subject=''; }
    S.view='class'; setDirty(false); render();
  }
  if(S.classes[ck]){ show(S.classes[ck]); return; }   // only this teacher writes these rows, so the session copy stays right
  var t0=Date.now(), dk0=S.teacher+'|'+S.month+'|'+(sup?'sup|':'')+c;
  call('webLoadClass',[S.teacher,S.pin,S.month,c].concat(sup?['sup']:[]),function(d){ if(obDone[dk0]>t0){ openClass(c,sup); return; } d=withPending(d,c,sup); S.classes[ck]=d; show(d); });
}
/** After the home page: load the classes the teacher already works on in the background, one at a time, so «تعديل» opens at once. */
function prefetchClasses(){
  if(prefetchClasses.on || !S.home || !S.home.classes) return;
  var k=hkey(), list=S.home.classes.map(function(x){return x.cls;}).concat(S.home.recent||[]).filter(function(c){ return !S.classes[k+'|'+c]; }).slice(0,4);
  if(!list.length) return;
  prefetchClasses.on=true;
  (function next(){
    if(!list.length || hkey()!==k || !S.pin){ prefetchClasses.on=false; return; }
    var c=list.shift();
    if(S.classes[k+'|'+c]){ next(); return; }
    var t0=Date.now(), dk0=S.teacher+'|'+S.month+'|'+c;
    call('webLoadClass',[S.teacher,S.pin,S.month,c],function(d){ if(hkey()===k && !S.classes[k+'|'+c] && !(obDone[dk0]>t0)) S.classes[k+'|'+c]=withPending(d,c,false); next(); },function(){ prefetchClasses.on=false; },true);
  })();
}

function tabBtn(k,l){return '<button class="tab'+(S.tab===k?' on':'')+'" data-tab="'+k+'">'+l+'</button>';}

// details helpers: S.det[name]["subject||item"] = {lvl, note}
function dk(sub,item){return sub+'||'+item;}
function dget(name,sub,item,f){ var o=S.det[name]&&S.det[name][dk(sub,item)]; var v=o?o[f]:''; return v==null?'':v; }
function dput(name,sub,item,f,v){ if(!S.det[name]) S.det[name]={}; var k=dk(sub,item); if(!S.det[name][k]) S.det[name][k]={lvl:'',note:''}; S.det[name][k][f]=v; setDirty(true); }
// skills table markers: «سلوك: …» rated with the class behaviour, «نص: …» free text, «تقدير: …» four levels, «بلا علامة» no grade
var RATEW=['يحتاج تدريب','مقبول','جيد','جيد جدًا','ممتاز'];   // «تقدير:» items: five levels in words, number under each
function skillList(sub){ return (S.data.skills[sub]||[]); }
function kindOf(x){ x=String(x); if(x==='بلا علامة') return 'nograde'; if(x.indexOf('سلوك:')===0) return 'beh'; if(x.indexOf('نص:')===0) return 'text'; if(x.indexOf('تقدير:')===0) return 'rate4'; return 'rate'; }
function labelOf(x){ return String(x).replace(/^(سلوك|نص|تقدير):\s*/,''); }
function subItems(){ var d=S.data, l=skillList(S.subject), out=[];
  if(l.indexOf('بلا علامة')<0) out.push({label:'العلامة (من 100)', grade:true, item:d.gradeItem});
  l.forEach(function(k){ var t=kindOf(k); if(t==='nograde'||t==='beh') return; out.push({label:labelOf(k), item:k, kind:t}); });
  return out; }
function hasHomework(sub){ return skillList(sub).some(function(k){ return kindOf(k)!=='beh' && /الواجب/.test(k); }); }
/** Behaviour items for the chosen subject: its profile (e.g. English: homework + participation), homework moved to the
 *  subject when the subject rates it, plus the subject's own «سلوك:» items (stored with the subject details). */
function quickItems(){ var d=S.data, prof=(d.profiles||{})[S.subject]||{}, base=d.quick.slice();
  if(!S.allItems){
    if(prof.quick) base=base.filter(function(q){ return prof.quick.indexOf(q.key)>=0; });
    if(hasHomework(S.subject)) base=base.filter(function(q){ return q.key!=='الالتزام بأداء الواجبات'; });
  }
  skillList(S.subject).forEach(function(k){ if(kindOf(k)==='beh') base.push({key:k,label:labelOf(k),det:true,sub:S.subject}); });
  return base; }
function subjPick(){ var d=S.data; if(!d.subjects.length) return '';
  var h='<div class="sub"><div class="lbl">البنود حسب المادة</div><div class="chips small">';
  d.subjects.forEach(function(s){ h+='<button class="chip'+(s===S.subject&&!S.allItems?' on':'')+'" data-sub="'+esc(s)+'">'+esc(s)+'</button>'; });
  return h+'<button class="chip'+(S.allItems?' on':'')+'" data-all="1">كل البنود</button></div>'+
    '<div class="hint" style="margin-top:6px">اختيار المادة يحدد البنود الظاهرة فقط؛ تقييمك في هذا التبويب واحد لهذا الصف مهما كانت المادة.</div></div>'; }
function iv(it,sh,name){ return it.det ? dget(name,it.sub,it.key,'lvl') : val(sh,name,it.key); }
function ip(it,sh,name,v){ if(it.det) dput(name,it.sub,it.key,'lvl',v); else put(sh,name,it.key,v); }
function noteBtn(name,item,i){ var k=name+'|'+dk(S.subject,item), has=String(dget(name,S.subject,item,'note')).trim()!=='';
  return '<button class="nb'+(has?' has':'')+'" data-nb="'+i+'" title="ملاحظة اختيارية">✎'+(has?' ملاحظة':'')+'</button>'; }
function noteRow(name,item,i){ var k=name+'|'+dk(S.subject,item), v=dget(name,S.subject,item,'note');
  if(!S.open[k] && String(v).trim()==='') return '';

    });
    return h+'</div><div class="legend">اترك خانة الطالب فارغة إن لم تكن له علامة هذا الشهر. <b>الملاحظة إجبارية مع كل علامة</b> (سبب العلامة أو ما يحتاجه الطالب).</div>';
  }

    d.students.forEach(function(st,i){ var v=dget(st.name,S.subject,it.item,'note');
      h+='<div class="row'+(String(v).trim()!==''?' done':'')+'"><div class="nm"><b>'+esc(st.name)+'</b></div><textarea class="t" data-n="'+i+'" placeholder="اكتب فقط لمن لاحظت عليه شيئًا">'+esc(v)+'</textarea></div>'; });
    return h+'</div><div class="legend">اكتب للطلاب الذين لاحظت عليهم شيئًا فقط، واترك الباقين فارغين.</div>';

  h+='<div class="bar"><span><b>'+esc(S.subject)+' — '+esc(it.label)+'</b></span><span class="grow"></span><span>'+done2+' من '+d.students.length+'</span>'+
     (four?'':'<button class="fill" data-dfill="4">عبّئ الفارغ بـ 4</button>')+'</div><div class="list">';

}

function eduGroups(){
  var d=S.data, prof=S.allItems?{}:((d.profiles||{})[S.subject]||{});
  var g=d.domains.filter(function(x){ return !prof.edu || prof.edu.indexOf(x.name)>=0; }).map(function(x){return {label:x.name.replace('الجانب ',''), items:x.items.map(function(it){return {key:it,label:it,type:'rate'};})};});
  if(!prof.edu) g.push({label:'تحسّن الصفة', items:[{key:d.trait.score,label:'تحسّن الصفة التي تحتاج علاجًا',type:'rate',trait:true},{key:d.trait.note,label:'ملاحظة عن الصفة',type:'text',trait:true}]});
  g.push({label:'ملاحظات', items:NOTES.map(function(n){return {key:n.key,label:n.label,type:'text'};})});
  return g;
}
function eduView(){
  var g=eduGroups(), h=subjPick()+'<div class="sub"><div class="lbl">الجانب</div><div class="chips">';

function itemSheet(it,mode){ return mode==='quick' ? it.sheet : 'edu'; }

function ratingView(items,mode){

  });
  h+='</div></div>';

function val(sheet,name,key){ var o=S[sheet][name]; return o && o[key]!==undefined && o[key]!==null ? o[key] : ''; }
function put(sheet,name,key,v){ if(!S[sheet][name]) S[sheet][name]={}; S[sheet][name][key]=v; setDirty(true); }

function currentItem(){
  if(S.tab==='quick'){ var q=quickItems()[S.quick]; return {it:q, sh:q.sheet}; }
  var it=eduGroups()[S.group].items[S.item]; return {it:it, sh:'edu'};
}

  });

/** A grade out of 100 that was entered or changed needs a note (why this grade). Returns the first student missing one. */

function missingGrades(){

    if(skillList(sub).indexOf('بلا علامة')>=0) return false;
    var touched=d.students.some(function(st){
      if(val('acad',st.name,sub)!=='') return true;
      var o=S.det[st.name]||{}; return Object.keys(o).some(function(k){ return k.indexOf(sub+'||')===0 && ((o[k].lvl!==''&&o[k].lvl!=null)||String(o[k].note||'').trim()!==''); });
    });
    if(!touched) return false;
    var miss=d.students.filter(function(st){ return val('acad',st.name,sub)===''; });
    if(miss.length){ out={sub:sub, st:miss[0], n:miss.length}; return true; }

var LDAYS=['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
function lDate(iso){ var m=String(iso||'').split('-'); return new Date(+m[0],+m[1]-1,+m[2],12); }
function lIso(d){ var p=function(n){return (n<10?'0':'')+n;}; return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
function lDayName(iso){ return LDAYS[lDate(iso).getDay()]; }
function lLabel(iso){ var m=String(iso).split('-'); return lDayName(iso)+' '+(+m[2])+'/'+(+m[1]); }
function lAdd(iso,n){ var d=lDate(iso); d.setDate(d.getDate()+n); return lIso(d); }
function lBase(c){ var I=S.li; return I && c.indexOf(I.kg+' - ')===0 ? I.kg : c; }
function lOverlap(a,b){ if(a===b) return true; var I=S.li; if(!I) return false; return (a===I.kg && lBase(b)===I.kg) || (b===I.kg && lBase(a)===I.kg); }
function lNl(s){ return esc(s).replace(/\n/g,'<br>'); }

/* Lessons outbox: a save or a delete is kept on the phone first and sent in order; the id is made here, so a repeated send never doubles a lesson. */
function lobGet(){ return jget('albaraem_les_outbox')||[]; }
function lobSet(a){ jput('albaraem_les_outbox',a); }
function lobMine(){ return lobGet().filter(function(x){ return x.who===S.teacher; }); }
function lobFlush(force){
  if(lobFlush.on || !S.pin) return;
  var a=lobGet(), k=-1;
  for(var i=0;i<a.length;i++){ if(a[i].who===S.teacher && (force || !a[i].err)){ k=i; break; } }
  if(k<0) return;
  var x=a[k]; lobFlush.on=true;
  function done(err,net){
    lobFlush.on=false;
    var b=lobGet(), j=-1; b.forEach(function(y,q){ if(y.k===x.k) j=q; });
    if(j>=0){ if(!err) b.splice(j,1); else if(net){ b[j].n=(b[j].n||0)+1; delete b[j].err; } else b[j].err=err; }
    lobSet(b);
    if(S.view==='lessons') renderLessons(true);
    if(!err){ if(lobMine().some(function(y){return !y.err;})) setTimeout(function(){ lobFlush(); },50); else lesRefresh(); }
    else if(net) setTimeout(function(){ lobFlush(); }, Math.min(60000, 4000*Math.pow(2,Math.min(4,(j>=0&&b[j].n)||1))));
    else setTimeout(function(){ lobFlush(); },50);   // go on with the next one; this one waits for the teacher
  }
  function fail(m){ done(m||'خطأ', !m || /تعذّر الاتصال|انتهت مهلة/.test(m)); }
  if(x.op==='del') call('webLessonDelete',[S.teacher,S.pin,x.id],function(){ done(''); },fail,true);
  else { var p=clone(x.p); p.name=S.teacher; p.pin=S.pin; call('webLessonSave',[p],function(){ done(''); },fail,true); }
}
window.addEventListener('online',function(){ lobFlush(true); });
/** The server's list with this phone's waiting saves and deletes applied on top. */
function lesMine(){
  var I=S.li, list=(I.mine||[]).map(function(x){ return clone(x); });
  lobMine().forEach(function(x){
    var j=-1; list.forEach(function(y,q){ if(y.id===x.id) j=q; });
    if(x.op==='del'){ if(j>=0) list.splice(j,1); return; }
    var o={id:x.id,date:x.p.date,cls:x.p.cls,subject:x.p.subject,p:+x.p.period,title:x.p.title,text:x.p.text,hw:x.p.hw,teacher:x.p.owner||S.teacher,edit:true,wait:true,err:x.err||''};
    if(j>=0){ o.hidden=list[j].hidden; o.by=list[j].by; list[j]=o; } else if(!x.p.owner) list.push(o);
  });
  list.sort(function(a,b){ return a.date<b.date?1:a.date>b.date?-1:a.p-b.p; });
  return list;
}
function lesDays(){

  S.view='parent'; S.pSub=''; var c=S.pl, h='';
  if(!c){ app.innerHTML='<div class="card"><h2>دروس اليوم</h2><div class="hint" style="margin-top:0">'+esc(S.plErr||'جارٍ التحميل…')+'</div>'+
    (S.plErr?'<button class="btn block" id="pRetry">إعادة المحاولة</button><button class="btn ghost block" id="pPick">اختيار الصف</button>':'')+'</div>';
    var r=document.getElementById('pRetry'); if(r) r.onclick=function(){ S.plErr=''; renderParent(); parentFetch(true); };
    var k=document.getElementById('pPick'); if(k) k.onclick=renderParentPick; return; }
  var d=c.d, subs=plSubjects(), nToday=0, nNew=0; subs.forEach(function(s){ nToday+=s.today; nNew+=s.fresh; });
  var a=String(d.label).split(' — ');
  h+='<div class="phero"><b>'+esc(a[0])+(a[1]?' <i>'+esc(a[1])+'</i>':'')+'</b>'+
     '<span>'+esc(lLabel(d.today))+'، '+(nToday? 'نُزّل اليوم '+nToday+(nToday===1?' درس':nToday===2?' درسان':nToday<=10?' دروس':' درسًا') : (d.school?'لم تُنزَّل دروس اليوم بعد':'لا دوام اليوم'))+'</span>'+
     (nNew?'<span class="pnew">'+(nNew===1?'درس واحد جديد لم تفتحه':nNew===2?'درسان جديدان لم تفتحهما':nNew+(nNew<=10?' دروس جديدة':' درسًا جديدًا')+' لم تفتحها')+'</span>':'')+
     '<div class="pact"><button id="pRef">تحديث</button><button id="pSwitch">تغيير الصف</button></div></div>';
  if(S.plErr) h+='<div class="banner">تعذّر التحديث الآن؛ هذه آخر نسخة محفوظة على الهاتف.</div>';
  h+='<div class="sgrid">';
  subs.slice().sort(function(x,y){ return (y.today?1:0)-(x.today?1:0) || (y.fresh?1:0)-(x.fresh?1:0) || (y.sched?1:0)-(x.sched?1:0) || (y.list.length?1:0)-(x.list.length?1:0) || x.i-y.i; }).forEach(function(s){
    var st = s.today ? '<em class="on">درس اليوم'+(s.hw?' · واجب':'')+'</em>' : s.sched ? '<em class="sc">حصة اليوم</em>' : s.list.length ? '<em>آخر درس: '+esc(lLabel(s.list[0].date))+'</em>' : '<em class="no">لا دروس بعد</em>';
    h+='<button class="stile c'+lesColor(s.name)+(s.dim?' dim':'')+(s.sched?' lit':'')+'" data-ps="'+esc(s.name)+'">'+(s.today?'<i class="rib" aria-hidden="true"></i>':'')+
      (s.fresh?'<span class="bdg" aria-label="'+s.fresh+' جديد">'+s.fresh+'</span>':'')+plIcon(s.name)+'<span class="lab"><b>'+esc(s.name)+'</b>'+st+'</span></button>'; });
  h+='</div><div class="hint" style="text-align:center;margin-top:16px">الدفاتر الزاهية موادّ اليوم في جدول الصف، والرقم عدد الدروس الجديدة التي لم تفتحها.</div>'+installCard();
  app.innerHTML=h; window.scrollTo(0,S.pY||0); S.pY=0;
  document.getElementById('pRef').onclick=function(){ parentFetch(true); };
  document.getElementById('pSwitch').onclick=function(){ renderParentPick(); };
  app.querySelectorAll('[data-ps]').forEach(function(b){ b.onclick=function(){ S.pY=window.scrollY; S.pSub=b.getAttribute('data-ps'); try{ history.pushState({albaraem:'psub'},''); }catch(e){} renderParentSubject(); }; });
  var di=document.getElementById('doInstall'); if(di) di.onclick=function(){ if(!deferredInstall) return; deferredInstall.prompt(); deferredInstall.userChoice.then(function(){ deferredInstall=null; renderParent(); }); };
  var hi=document.getElementById('hideInstall'); if(hi) hi.onclick=function(){ store('albaraem_install_hide','1'); renderParent(); };
}
function renderParentSubject(keepScroll){
  var y=window.scrollY; S.view='psub';
  var d=S.pl.d, s=plSubjects().filter(function(x){ return x.name===S.pSub; })[0];
  if(!s){ renderParent(); return; }
  if(keepScroll && S.pNew) s.list.forEach(function(x){ if(S.pNew[plKey(s.name,x)]) x.isNew=true; });   // a refresh while reading keeps the «جديد» marks
  else { S.pNew={}; s.list.forEach(function(x){ if(x.isNew) S.pNew[plKey(s.name,x)]=1; }); }
  var a=String(d.label).split(' — '), h='<button class="pback" id="pBack">› دفاتر المواد</button>'+
    '<div class="nbk c'+lesColor(s.name)+'"><div class="shero">'+plIcon(s.name)+'<b>'+esc(s.name)+'</b><small>'+esc(a.join('، '))+'</small></div><div class="npage">';
  var t=s.list.filter(function(x){ return x.date===d.today; }), old=s.list.filter(function(x){ return x.date!==d.today; });
  if(t.length) h+=t.sort(function(x,y){return x.p-y.p;}).map(function(x){ return plLesson(x,true); }).join('');
  else h+='<div class="lcard none"><div class="mg"><i>اليوم</i></div><div class="en"><p>'+(s.sched?'حصة اليوم لم يُنزَّل درسها بعد.':'لا حصة لهذه المادة اليوم.')+'</p></div></div>';
  h+=old.map(function(x){ return plLesson(x,false); }).join('');
  if(!old.length) h+='<div class="lcard none"><div class="mg"></div><div class="en"><p>لا دروس سابقة في آخر '+(d.keep||7)+' يومًا.</p></div></div>';
  h+='</div></div>';
  app.innerHTML=h; window.scrollTo(0,keepScroll?y:0);
  document.getElementById('pBack').onclick=function(){ renderParent(); };
  plMarkSeen(s);
}
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState!=='visible') return;
  if((S.view==='parent'||S.view==='psub') && S.pl && Date.now()-(S.pl.at||0)>60000) parentFetch(false);
  if(S.view==='lessons' && S.pin) lesRefresh();
});

document.getElementById('saveBtn').onclick=function(){ if(busy>0) return; if(S.view==='lesson') saveLesson(); else if(S.view==='visit') saveVisit(); else if(S.view==='tasks') saveTasks(); else if(S.view==='tg') saveTg(); else if(S.view==='fam') saveFam(); else if(S.view==='meet') saveMeet(); else saveClass(); };
start();
</script>
<script>if('serviceWorker' in navigator){addEventListener('load',function(){navigator.serviceWorker.register('sw.js');});}</script>
